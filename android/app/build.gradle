apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// 릴리스 서명 — keystore.properties(gitignore, 로컬 시크릿)가 있을 때만 적용.
// 없으면(다른 개발자/CI) release도 서명 없이 빌드되어 깨지지 않는다(Play 업로드만 불가).
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace = "fan.keubo.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fan.keubo.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 16
        versionName "1.0.17"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // minify는 v1 비활성 유지 — Capacitor 플러그인 리플렉션 리스크 회피(후속 검토).
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

def releaseCapacitorConfigFile = file("src/main/assets/capacitor.config.json")

tasks.register("validateReleaseCapacitorConfig") {
    inputs.file(releaseCapacitorConfigFile)
    doLast {
        if (!releaseCapacitorConfigFile.exists()) {
            throw new GradleException("Missing Android Capacitor config: ${releaseCapacitorConfigFile}. Run npx cap sync android before release.")
        }

        def capacitorConfig = new groovy.json.JsonSlurper().parse(releaseCapacitorConfigFile)
        def serverUrl = capacitorConfig.server?.url
        if (serverUrl != "https://keubo.fan") {
            throw new GradleException("Invalid Android release server.url '${serverUrl}'. Expected https://keubo.fan, not localhost.")
        }
    }
}

afterEvaluate {
    tasks.named("preReleaseBuild").configure {
        dependsOn(tasks.named("validateReleaseCapacitorConfig"))
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // KboMessagingService가 FirebaseMessagingService를 확장하므로 앱 컴파일 클래스패스에 필요
    // (capacitor-firebase-messaging 플러그인은 implementation이라 transitive 노출 안 됨).
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    // OAuthBrowserPlugin이 Chrome Custom Tab(androidx.browser)을 직접 사용하므로 앱 컴파일
    // 클래스패스에 필요(capacitor-browser 플러그인은 implementation이라 transitive 노출 안 됨).
    implementation "androidx.browser:browser:1.8.0"
    implementation "com.facebook.android:facebook-android-sdk:18.3.0"
    // 인앱 Google Play 리뷰 요청(AppReviewPlugin) — Play In-App Review API
    implementation "com.google.android.play:review:2.0.2"
    // SecureSessionStorePlugin — 세션 백업 EncryptedSharedPreferences(Keystore 마스터키)
    implementation "androidx.security:security-crypto:1.1.0"
    // 갤럭시워치(Wear OS) 최애팀 동기화 — GameNotificationPlugin.setMyTeam이 Data Layer push.
    // 워치 미연결 기기에선 no-op(안전).
    implementation "com.google.android.gms:play-services-wearable:18.2.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
