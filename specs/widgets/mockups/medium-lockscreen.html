<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Noto+Sans+KR:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; padding:38px; font-family:'Montserrat','Noto Sans KR',sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:18px; }
  .cap { color:#9a9aa0; font-size:17px; font-family:'Noto Sans KR',sans-serif; letter-spacing:-0.03em; align-self:flex-start; }
  .note { color:#5fd27a; font-size:15px; font-family:'Noto Sans KR',sans-serif; letter-spacing:-0.03em; align-self:flex-start; }

  .la-slot { width:430px; background:#0c0c0e; border-radius:26px; padding:6px;
             border:1px dashed rgba(255,255,255,0.18); display:flex; }
  .card { position:relative; flex:1; border-radius:22px; padding:11px 18px; overflow:hidden; color:#F5F5F7;
    background:linear-gradient(135deg, color-mix(in srgb, #C60C30 40%, #1a1a1d) 0%, #1a1a1d 100%);
    display:flex; flex-direction:column; gap:7px; }
  .watermark { position:absolute; right:14px; top:10px; width:84px; opacity:0.13; }
  .header { display:flex; align-items:center; gap:7px; }
  .header .ls { width:24px; height:24px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; }
  .header .ls img { width:17px; height:17px; object-fit:contain; }
  .header .label { font-size:15px; font-weight:900; letter-spacing:0.5px; color:#fff; }
  .score { display:flex; align-items:center; justify-content:space-between; }
  .team { display:flex; flex-direction:column; align-items:center; gap:3px; flex:1; }
  .team .logo { width:42px; height:42px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; }
  .team .logo img { width:30px; height:30px; object-fit:contain; }
  .team .name { font-size:19px; font-weight:900; color:#fff; }
  .center { display:flex; flex-direction:column; align-items:center; gap:3px; }
  .center .stadium { font-size:13px; color:rgba(255,255,255,0.75); font-family:'Noto Sans KR',sans-serif; letter-spacing:-0.04em; }
  .center .nums { display:flex; align-items:center; gap:11px; }
  .center .nums .n { font-size:34px; font-weight:900; color:#fff; }
  .center .nums .colon { font-size:18px; color:#9b9b9f; }
  .center .live { font-size:13px; font-weight:700; color:#fff; letter-spacing:-0.02em; background:rgba(229,57,53,0.85); padding:2px 10px; border-radius:999px; font-family:'Noto Sans KR',sans-serif; }
  .divider { height:1px; background:rgba(255,255,255,0.12); }
  .bottom { display:flex; align-items:center; justify-content:space-between; }
  .left { display:flex; flex-direction:column; gap:5px; }
  .out { display:flex; align-items:center; gap:6px; font-size:13px; color:#C9C9CE; font-weight:600; }
  .out .dots { display:flex; gap:5px; }
  .out .dots i { width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.2); border:1.5px solid rgba(255,255,255,0.32); display:inline-block; }
  .out .dots i.on { background:#FF4D4D; border-color:#FF4D4D; }
  .pab { display:flex; flex-direction:column; gap:4px; font-size:18px; font-weight:700; color:#F2F2F5; font-family:'Noto Sans KR',sans-serif; letter-spacing:-0.045em; }
  .pab .k { color:#AEAEB4; font-weight:600; margin-right:6px; font-size:15px; }
  .diamond { position:relative; width:70px; height:60px; }
  .base { position:absolute; width:18px; height:18px; border-radius:3px; background:rgba(255,255,255,0.2); border:1.5px solid rgba(255,255,255,0.32); transform:rotate(45deg); }
  .base.on { background:#FF4D4D; border-color:#FF4D4D; }
  .b2 { left:26px; top:0; } .b1 { right:0; top:21px; } .b3 { left:0; top:21px; }
</style>
</head>
<body>
  <div class="cap">medium 위젯 = 잠금화면 카드 동일 (풀네임·아웃·투타·다이아몬드)</div>
  <div class="la-slot">
    <div class="card">
      <img class="watermark" src="./logos/lg.svg" alt="">
      <div class="header"><div class="ls"><img src="./logos/lg.svg"></div><span class="label">MY TEAM</span></div>
      <div class="score">
        <div class="team"><div class="logo"><img src="./logos/ssg.svg"></div><span class="name">SSG 랜더스</span></div>
        <div class="center">
          <span class="stadium">잠실</span>
          <div class="nums"><span class="n">2</span><span class="colon">:</span><span class="n">1</span></div>
          <span class="live">LIVE 2회초</span>
        </div>
        <div class="team"><div class="logo"><img src="./logos/lg.svg"></div><span class="name">LG 트윈스</span></div>
      </div>
      <div class="divider"></div>
      <div class="bottom">
        <div class="left">
          <div class="out">O <span class="dots"><i class="on"></i><i></i><i></i></span></div>
          <div class="pab">
            <span><span class="k">투수 (LG)</span>웰스</span>
            <span><span class="k">타자 (SSG)</span>조형우</span>
          </div>
        </div>
        <div class="diamond"><div class="base b2"></div><div class="base b1 on"></div><div class="base b3 on"></div></div>
      </div>
    </div>
  </div>
  <div class="note">✓ 헤더·점수·구장·이닝·아웃·투수·타자·다이아몬드 전부 유지, 상하 잘림 없이 수용 (실제 높이는 리빌드 확정)</div>
</body>
</html>
