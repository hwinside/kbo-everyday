<!-- Shared head includes for all redesign section pages. Copy-paste into each page's <head>/<body>. -->
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; overflow: hidden; }
  body { font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  #tweaks-panel {
    position: fixed; right: 16px; bottom: 16px; z-index: 9999;
    background: #0E0E12; color: rgba(255,255,255,0.92);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
    padding: 14px; width: 280px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.25);
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    display: none;
  }
  #tweaks-panel.open { display: block; }
  .tp-title { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: rgba(255,255,255,0.5); text-transform: uppercase; margin-bottom: 10px; }
  .tp-label { font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 6px; }
  .tp-teams { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 14px; }
  .tp-team { aspect-ratio: 1; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 4px; }
  .tp-team.on { border-color: currentColor; background: rgba(255,255,255,0.1); }
  .tp-team img { width: 100%; height: 100%; object-fit: contain; }
  .tp-slider { width: 100%; accent-color: currentColor; }
  /* Back-to-flow nav */
  .rd-flownav {
    position: fixed; top: 16px; left: 16px; z-index: 9999;
    display: flex; gap: 8px; align-items: center;
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
  }
  .rd-flownav a {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 12px; border-radius: 999px;
    background: rgba(14,14,18,0.85); color: rgba(255,255,255,0.9);
    text-decoration: none; font-size: 12px; font-weight: 600;
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
  }
  .rd-flownav a:hover { background: rgba(14,14,18,0.95); }
</style>
