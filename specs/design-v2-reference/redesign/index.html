<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>크보팬 — 디자인 개선 시안</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; overflow: hidden; }
  body { font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
  #tweaks-panel {
    position: fixed; right: 16px; bottom: 16px; z-index: 9999;
    background: #0E0E12; color: rgba(255,255,255,0.92);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
    padding: 14px; width: 280px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.25);
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    display: none;
  }
  #tweaks-panel.open { display: block; }
  .tp-title { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; color: rgba(255,255,255,0.5); text-transform: uppercase; margin-bottom: 10px; }
  .tp-label { font-size: 12px; color: rgba(255,255,255,0.6); margin-bottom: 6px; }
  .tp-teams { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 14px; }
  .tp-team { aspect-ratio: 1; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 4px; }
  .tp-team.on { border-color: currentColor; background: rgba(255,255,255,0.1); }
  .tp-team img { width: 100%; height: 100%; object-fit: contain; }
  .tp-slider { width: 100%; accent-color: currentColor; }
</style>
</head>

<div id="root"></div>

<div id="tweaks-panel">
  <div class="tp-title">Tweaks</div>
  <div class="tp-label">MY TEAM</div>
  <div class="tp-teams" id="tp-teams"></div>
  <div class="tp-label">팀 컬러 강도 <span id="tp-intensity-val" style="float:right;color:#fff;">6</span></div>
  <input type="range" id="tp-intensity" class="tp-slider" min="0" max="10" value="6" step="1"/>
</div>

<script type="text/babel" data-presets="react">
/* ===== design-canvas.jsx ===== */

// DesignCanvas.jsx — Figma-ish design canvas wrapper
// Warm gray grid bg + Sections + Artboards + PostIt notes.
// No assets, no deps.

const DC = {
  bg: '#f0eee9',
  grid: 'rgba(0,0,0,0.06)',
  label: 'rgba(60,50,40,0.7)',
  title: 'rgba(40,30,20,0.85)',
  subtitle: 'rgba(60,50,40,0.6)',
  postitBg: '#fef4a8',
  postitText: '#5a4a2a',
  font: '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
};

// ─────────────────────────────────────────────────────────────
// Main canvas — transform-based pan/zoom viewport
//
// Input mapping (Figma-style):
//   • trackpad pinch  → zoom   (ctrlKey wheel; Safari gesture* events)
//   • trackpad scroll → pan    (two-finger)
//   • mouse wheel     → zoom   (notched; distinguished from trackpad scroll)
//   • middle-drag / primary-drag-on-bg → pan
//
// Transform state lives in a ref and is written straight to the DOM
// (translate3d + will-change) so wheel ticks don't go through React —
// keeps pans at 60fps on dense canvases.
// ─────────────────────────────────────────────────────────────
function DesignCanvas({ children, minScale = 0.1, maxScale = 8, style = {} }) {
  const vpRef = React.useRef(null);
  const worldRef = React.useRef(null);
  const tf = React.useRef({ x: 0, y: 0, scale: 1 });

  const apply = React.useCallback(() => {
    const { x, y, scale } = tf.current;
    const el = worldRef.current;
    if (el) el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
  }, []);

  React.useEffect(() => {
    const vp = vpRef.current;
    if (!vp) return;

    const zoomAt = (cx, cy, factor) => {
      const r = vp.getBoundingClientRect();
      const px = cx - r.left, py = cy - r.top;
      const t = tf.current;
      const next = Math.min(maxScale, Math.max(minScale, t.scale * factor));
      const k = next / t.scale;
      // keep the world point under the cursor fixed
      t.x = px - (px - t.x) * k;
      t.y = py - (py - t.y) * k;
      t.scale = next;
      apply();
    };

    // Mouse-wheel vs trackpad-scroll heuristic. A physical wheel sends
    // line-mode deltas (Firefox) or large integer pixel deltas with no X
    // component (Chrome/Safari, typically multiples of 100/120). Trackpad
    // two-finger scroll sends small/fractional pixel deltas, often with
    // non-zero deltaX. ctrlKey is set by the browser for trackpad pinch.
    const isMouseWheel = (e) =>
      e.deltaMode !== 0 ||
      (e.deltaX === 0 && Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 40);

    const onWheel = (e) => {
      e.preventDefault();
      if (isGesturing) return; // Safari: gesture* owns the pinch — discard concurrent wheels
      if (e.ctrlKey) {
        // trackpad pinch (or explicit ctrl+wheel)
        zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
      } else if (isMouseWheel(e)) {
        // notched mouse wheel — fixed-ratio step per click
        zoomAt(e.clientX, e.clientY, Math.exp(-Math.sign(e.deltaY) * 0.18));
      } else {
        // trackpad two-finger scroll — pan
        tf.current.x -= e.deltaX;
        tf.current.y -= e.deltaY;
        apply();
      }
    };

    // Safari sends native gesture* events for trackpad pinch with a smooth
    // e.scale; preferring these over the ctrl+wheel fallback gives a much
    // better feel there. No-ops on other browsers. Safari also fires
    // ctrlKey wheel events during the same pinch — isGesturing makes
    // onWheel drop those entirely so they neither zoom nor pan.
    let gsBase = 1;
    let isGesturing = false;
    const onGestureStart = (e) => { e.preventDefault(); isGesturing = true; gsBase = tf.current.scale; };
    const onGestureChange = (e) => {
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, (gsBase * e.scale) / tf.current.scale);
    };
    const onGestureEnd = (e) => { e.preventDefault(); isGesturing = false; };

    // Drag-pan: middle button anywhere, or primary button starting on the
    // canvas background (not inside an artboard).
    let drag = null;
    const onPointerDown = (e) => {
      const onBg = e.target === vp || e.target === worldRef.current;
      if (!(e.button === 1 || (e.button === 0 && onBg))) return;
      e.preventDefault();
      vp.setPointerCapture(e.pointerId);
      drag = { id: e.pointerId, lx: e.clientX, ly: e.clientY };
      vp.style.cursor = 'grabbing';
    };
    const onPointerMove = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      tf.current.x += e.clientX - drag.lx;
      tf.current.y += e.clientY - drag.ly;
      drag.lx = e.clientX; drag.ly = e.clientY;
      apply();
    };
    const onPointerUp = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      vp.releasePointerCapture(e.pointerId);
      drag = null;
      vp.style.cursor = '';
    };

    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('gesturestart', onGestureStart, { passive: false });
    vp.addEventListener('gesturechange', onGestureChange, { passive: false });
    vp.addEventListener('gestureend', onGestureEnd, { passive: false });
    vp.addEventListener('pointerdown', onPointerDown);
    vp.addEventListener('pointermove', onPointerMove);
    vp.addEventListener('pointerup', onPointerUp);
    vp.addEventListener('pointercancel', onPointerUp);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('gesturestart', onGestureStart);
      vp.removeEventListener('gesturechange', onGestureChange);
      vp.removeEventListener('gestureend', onGestureEnd);
      vp.removeEventListener('pointerdown', onPointerDown);
      vp.removeEventListener('pointermove', onPointerMove);
      vp.removeEventListener('pointerup', onPointerUp);
      vp.removeEventListener('pointercancel', onPointerUp);
    };
  }, [apply, minScale, maxScale]);

  const gridSvg = `url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0H0v120' fill='none' stroke='${encodeURIComponent(DC.grid)}' stroke-width='1'/%3E%3C/svg%3E")`;
  return (
    <div
      ref={vpRef}
      className="design-canvas"
      style={{
        height: '100vh', width: '100vw',
        background: DC.bg,
        overflow: 'hidden',
        overscrollBehavior: 'none',
        touchAction: 'none',
        position: 'relative',
        fontFamily: DC.font,
        boxSizing: 'border-box',
        ...style,
      }}
    >
      <div
        ref={worldRef}
        style={{
          position: 'absolute', top: 0, left: 0,
          transformOrigin: '0 0',
          willChange: 'transform',
          width: 'max-content', minWidth: '100%',
          minHeight: '100%',
          padding: '60px 0 80px',
          backgroundImage: gridSvg,
          backgroundSize: '120px 120px',
        }}
      >
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Section — title + subtitle + h-stack of artboards (no wrap)
// ─────────────────────────────────────────────────────────────
function DCSection({ title, subtitle, children, gap = 48 }) {
  return (
    <div style={{ marginBottom: 80, position: 'relative' }}>
      <div style={{ padding: '0 60px 36px' }}>
        <div style={{
          fontSize: 22, fontWeight: 600, color: DC.title,
          letterSpacing: -0.3, marginBottom: 4,
        }}>{title}</div>
        {subtitle && (
          <div style={{
            fontSize: 14, fontWeight: 400, color: DC.subtitle,
          }}>{subtitle}</div>
        )}
      </div>
      {/* h-stack — clips offscreen, never wraps */}
      <div style={{
        display: 'flex', gap, padding: '0 60px',
        alignItems: 'flex-start', width: 'max-content',
      }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Artboard — labeled card
// ─────────────────────────────────────────────────────────────
function DCArtboard({ label, children, width, height, style = {} }) {
  return (
    <div style={{ position: 'relative', flexShrink: 0 }}>
      {label && (
        <div style={{
          position: 'absolute', bottom: '100%', left: 0,
          paddingBottom: 8,
          fontSize: 12, fontWeight: 500, color: DC.label,
          whiteSpace: 'nowrap',
        }}>{label}</div>
      )}

function Donut({ value, max = 1, color, bg, size = 64, stroke = 8, label }) {
  const pct = Math.min(1, value / max);
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  return (
    <div style={{ position: 'relative', width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
        <circle cx={size/2} cy={size/2} r={r} stroke={bg || waP('#fff', 0.08)} strokeWidth={stroke} fill="none"/>
        <circle cx={size/2} cy={size/2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeDasharray={`${c * pct} ${c}`} strokeLinecap="round"/>
      </svg>
      <div style={{
        position: 'absolute', inset: 0,
        display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
      }}>
        {label && <div style={{ fontSize: 8, fontWeight: 700, color: NP.text3, letterSpacing: 0.4 }}>{label}</div>}
      </div>
    </div>
  );
}

        <div style={{ fontSize: 14, fontWeight: 800, color: NT.text1, letterSpacing: -0.3 }}>2024년 9월</div>

        }}>
          <span style={{ fontSize: 10, fontWeight: 800, color: palette.accent, letterSpacing: 0.5 }}>이번 달 성적</span>
          <span style={{ fontSize: 12, fontWeight: 800, color: NT.text1, fontVariantNumeric: 'tabular-nums' }}>
            <b style={{ color: NT.win }}>14승</b> 8패 · 승률 .636
          </span>

      {/* Calendar */}

            <div key={d} style={{
              textAlign: 'center', fontSize: 9, fontWeight: 700, padding: '4px 0',
              color: i === 0 ? NT.live : (i === 6 ? palette.accent : NT.text3),
            }}>{d}</div>
          ))}
        </div>
        {/* cells */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 4 }}>
          {cells.map((c, i) => {
            if (!c) return <div key={i}/>;
            if (c.empty) return <div key={i} style={{ aspectRatio: '1/1.1' }}/>;
            if (c.rest || !c.opp) {
              return (
                <div key={i} style={{
                  aspectRatio: '1/1.1', borderRadius: 8,
                  background: c.rest ? waT('#fff', 0.02) : 'transparent',
                  border: `1px solid ${NT.line}`,

              );

            const opp = TT[c.opp];
            const isLive = c.result === 'live';
            const isNext = c.result === 'next';
            const w = c.result === 'W';
            const l = c.result === 'L';
            return (
              <div key={i} style={{
                aspectRatio: '1/1.1', borderRadius: 8,
                background: isLive ? waT(NT.live, 0.2) :
                            w ? waT(NT.win, 0.12) :
                            l ? waT(NT.text4, 0.1) :
                            NT.bg2,
                border: `1px solid ${
                  isLive ? NT.live :
                  isNext ? waT(palette.base, 0.35) :
                  NT.line
                }`,
                display: 'flex', flexDirection: 'column',
                padding: '3px 4px',
                position: 'relative',
              }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
                  <div style={{ fontSize: 9, fontWeight: 700, color: NT.text2, fontVariantNumeric: 'tabular-nums' }}>{c.day}</div>

                </div>
                <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <TeamLogo team={opp} size={18}/>
                </div>
                {isLive && (
                  <div style={{ position: 'absolute', top: 2, right: 2, width: 4, height: 4, borderRadius: '50%', background: NT.live, boxShadow: `0 0 4px ${NT.live}` }}/>
                )}
                {(w || l) && (
                  <div style={{
                    position: 'absolute', bottom: 2, right: 3,
                    fontSize: 7, fontWeight: 900, letterSpacing: 0.3,
                    color: w ? NT.win : NT.text4,
                  }}>{w ? 'W' : 'L'}</div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      <TabBar active="teams" palette={palette}/>
    </>
  );
}

// ─────────────────────────── 6) Head-to-head matrix

function ScreenHeadToHead({ team, palette }) {
  const t = palette.isNeutral ? TT.doosan : team;
  // Build 10x10 matrix with opponent records vs row team
  // For simplicity we render row = team, col = opponent, cell = W-L diff
  const allTeams = ['kia','samsung','lg','doosan','kt','ssg','lotte','hanwha','nc','kiwoom'];

  // Mock records for row team's H2H vs each opponent
  const vsRecords = {
    kia:     { w: 4, l: 11, d: 1 },
    samsung: { w: 7, l: 8,  d: 1 },
    lg:      { w: 9, l: 7,  d: 0 },
    doosan:  { w: 8, l: 7,  d: 1 },
    kt:      { w: 12, l: 4, d: 0 },
    ssg:     { w: 8, l: 7,  d: 1 },
    lotte:   { w: 9, l: 6,  d: 1 },
    hanwha:  { w: 11, l: 5, d: 0 },
    nc:      { w: 10, l: 5, d: 1 },
    kiwoom:  { w: 14, l: 2, d: 0 },
  };

  // remove the team's own row from display
  const oppList = allTeams.filter(s => s !== t.slug);

  const totalW = oppList.reduce((a, s) => a + vsRecords[s].w, 0);
  const totalL = oppList.reduce((a, s) => a + vsRecords[s].l, 0);

  return (
    <>
      <StatusBar tint={NT.text1}/>
      <PhoneHeader title={`${t.short} 상대 전적`}/>

      {/* Summary */}
      <div style={{ padding: '0 16px 14px' }}>
        <div style={{
          borderRadius: 16, padding: '12px 14px',
          background: `linear-gradient(135deg, ${waT(t.primary, 0.2)}, ${NT.bg2} 85%)`,
          border: `1px solid ${waT(t.primary, 0.25)}`,
          display: 'flex', alignItems: 'center', gap: 14,
        }}>
          <TeamLogo team={t} size={36}/>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 10, fontWeight: 800, color: NT.text3, letterSpacing: 0.5 }}>시즌 통산</div>
            <div style={{ fontSize: 18, fontWeight: 900, color: NT.text1, letterSpacing: -0.5, fontVariantNumeric: 'tabular-nums' }}>
              <b style={{ color: NT.win }}>{totalW}</b>승 {totalL}패
            </div>
          </div>
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: 10, color: NT.text3, fontWeight: 700 }}>승률</div>
            <div style={{ fontSize: 16, fontWeight: 900, color: palette.accent, letterSpacing: -0.4, fontVariantNumeric: 'tabular-nums' }}>.{(totalW/(totalW+totalL)).toFixed(3).slice(2)}</div>
          </div>
        </div>
      </div>

      {/* Matrix */}
      <div style={{ padding: '0 16px' }}>
        <div style={{ fontSize: 10, fontWeight: 800, color: NT.text3, letterSpacing: 1, marginBottom: 8, textTransform: 'uppercase' }}>상대별 전적</div>
        <div style={{
          borderRadius: 14, background: NT.bg2, border: `1px solid ${NT.line}`, overflow: 'hidden',
        }}>
          {oppList.map((slug, i) => {
            const opp = TT[slug];
            const r = vsRecords[slug];
            const total = r.w + r.l;
            const winPct = r.w / total;
            const dominant = winPct >= 0.6;
            const weak = winPct <= 0.4;
            return (
              <div key={slug} style={{
                display: 'grid', gridTemplateColumns: '24px 1fr auto 70px',
                padding: '10px 14px', alignItems: 'center', gap: 10,
                borderBottom: i < oppList.length - 1 ? `1px solid ${waT('#fff', 0.04)}` : 'none',
              }}>
                <TeamLogo team={opp} size={22}/>
                <div style={{ fontSize: 12, fontWeight: 700, color: NT.text1, letterSpacing: -0.2 }}>{opp.short}</div>
                <div style={{
                  display: 'flex', alignItems: 'center', gap: 4,
                  fontSize: 11.5, fontWeight: 800, fontVariantNumeric: 'tabular-nums',
                }}>
                  <span style={{ color: NT.win }}>{r.w}</span>
                  <span style={{ color: NT.text4, fontSize: 9 }}>-</span>
                  <span style={{ color: NT.text3 }}>{r.l}</span>
                  {r.d > 0 && <span style={{ color: NT.text4, fontSize: 9 }}>·{r.d}무</span>}
                </div>
                {/* win % bar */}
                <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
                  <div style={{ flex: 1, height: 5, borderRadius: 2, background: waT(NT.text4, 0.25), overflow: 'hidden', display: 'flex' }}>
                    <div style={{
                      width: `${winPct * 100}%`, height: '100%',
                      background: dominant ? NT.win : weak ? waT(NT.text4, 0.5) : waT(palette.base, 0.7),
                    }}/>
                  </div>
                  <div style={{
                    fontSize: 9, fontWeight: 800, fontVariantNumeric: 'tabular-nums',
                    minWidth: 28, textAlign: 'right',
                    color: dominant ? NT.win : weak ? NT.text4 : NT.text2,
                  }}>.{winPct.toFixed(3).slice(2)}</div>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Legend */}
      <div style={{ padding: '8px 16px 0', display: 'flex', gap: 10, fontSize: 9, color: NT.text3, alignItems: 'center' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 3 }}>
          <div style={{ width: 10, height: 3, background: NT.win, borderRadius: 1 }}/>
          <span>우세 (0.6↑)</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 3 }}>
          <div style={{ width: 10, height: 3, background: waT(palette.base, 0.7), borderRadius: 1 }}/>

          <div style={{ width: 10, height: 3, background: waT(NT.text4, 0.5), borderRadius: 1 }}/>
          <span>약세 (0.4↓)</span>
        </div>
      </div>

      <TabBar active="teams" palette={palette}/>
    </>
  );
}

            <ScreenCommunityComposer team={team} palette={palette}/>
          </PhoneFrame>
          <PhoneFrame team={team} palette={palette} label="17 · 댓글 전체 (대댓글)">
            <ScreenCommunityComments team={team} palette={palette}/>
          </PhoneFrame>
          <PhoneFrame team={team} palette={palette} label="18 · 검색">
            <ScreenCommunitySearch team={team} palette={palette}/>
          </PhoneFrame>
          <PhoneFrame team={team} palette={palette} label="19 · 활동 알림">
            <ScreenCommunityActivity team={team} palette={palette}/>
          </PhoneFrame>

          <DCPostIt top={-30} left={-40} rotate={-2} width={220}>
            댓글 작성자 이름 색 = 자기 응원팀 컬러<br/>
            → 글 안에서도 팬덤이 보임
          </DCPostIt>
        </DCSection>

        {/* Player — 6 screens */}
        <DCSection title="2D · 선수 페이지 전체" subtitle="로스터 → 프로필 → 스탯 → 경기별 → 비교 → 응원글. 데이터 밀도가 가장 높은 영역 — 수치는 tabular-nums로 정렬.">
          <PhoneFrame team={team} palette={palette} label="20 · 선수 리스트 (로스터)">
            <ScreenPlayerList team={team} palette={palette}/>
          </PhoneFrame>
          <PhoneFrame team={team} palette={palette} label="21 · 선수 프로필">
            <ScreenPlayerProfile team={team} palette={palette}/>
          </PhoneFrame>
          <PhoneFrame team={team} palette={palette} label="22 · 시즌 스탯 상세">
            <ScreenPlayerStats team={team} palette={palette}/>
          </PhoneFrame>
          <PhoneFrame team={team} palette={palette} label="23 · 경기별 기록">
            <ScreenPlayerGameLog team={team} palette={palette}/>
          </PhoneFrame>
          <PhoneFrame team={team} palette={palette} label="24 · 선수 비교">
            <ScreenPlayerCompare team={team} palette={palette}/>
          </PhoneFrame>
          <PhoneFrame team={team} palette={palette} label="25 · 선수 응원글">
            <ScreenPlayerBoard team={team} palette={palette}/>
          </PhoneFrame>

          <DCPostIt top={-50} left={-40} rotate={4} width={220}>
            프로필 히어로 = 등번호 워터마크<br/>
            + 팀 컬러 그라데이션<br/>
            유니폼 같은 느낌
          </DCPostIt>
        </DCSection>

        {/* Team — 6 screens */}
        <DCSection title="2E · 팀 · 순위 · 기록" subtitle="팀 허브 → 순위 → 스케줄 → 팀 기록 → 리그 기록 → 상대 전적. 데이터 집계와 시각화 중심.">
          <PhoneFrame team={team} palette={palette} label="26 · 팀 허브">
            <ScreenTeamHub team={team} palette={palette}/>
          </PhoneFrame>
          <PhoneFrame team={team} palette={palette} label="27 · 순위 상세">
            <ScreenStandingsDetail team={team} palette={palette}/>
          </PhoneFrame>
          <PhoneFrame team={team} palette={palette} label="28 · 팀 스케줄 (월)">
            <ScreenTeamSchedule team={team} palette={palette}/>
          </PhoneFrame>
          <PhoneFrame team={team} palette={palette} label="29 · 팀 기록">
            <ScreenTeamRecords team={team} palette={palette}/>
          </PhoneFrame>
          <PhoneFrame team={team} palette={palette} label="30 · 리그 기록실">
            <ScreenLeagueRecords team={team} palette={palette}/>
          </PhoneFrame>
          <PhoneFrame team={team} palette={palette} label="31 · 상대 전적">
            <ScreenHeadToHead team={team} palette={palette}/>
          </PhoneFrame>

          <DCPostIt top={-40} left={-40} rotate={-3} width={220}>
            스케줄 캘린더 = W/L/라이브/예정<br/>
            4가지 상태 색상으로 구분<br/>
            한눈에 팀 흐름 파악
          </DCPostIt>
        </DCSection>

        {/* Notes */}
        <DCSection title="3 · 개선 포인트" subtitle="기존 디자인 대비 달라지는 핵심 변화.">
          <DCArtboard label="통일성" width={320} height={220} style={{ background: '#fff', padding: 22 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: '#888', letterSpacing: 1, textTransform: 'uppercase', marginBottom: 10 }}>UNIFY</div>
            <div style={{ fontSize: 16, fontWeight: 700, color: '#222', lineHeight: 1.4, marginBottom: 10, letterSpacing: -0.3 }}>
              모든 카드 = 같은 규칙
            </div>
            <div style={{ fontSize: 12, lineHeight: 1.6, color: '#666' }}>
              · radius 14/20/24 3단계<br/>
              · padding 10/14/18 3단계<br/>
              · 카드 배경은 BG2 또는 tint<br/>
              · 보더 rgba(white, 0.07) 고정
            </div>
          </DCArtboard>
          <DCArtboard label="완성도" width={320} height={220} style={{ background: '#fff', padding: 22 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: '#888', letterSpacing: 1, textTransform: 'uppercase', marginBottom: 10 }}>POLISH</div>
            <div style={{ fontSize: 16, fontWeight: 700, color: '#222', lineHeight: 1.4, marginBottom: 10, letterSpacing: -0.3 }}>
              숫자·위계·여백의 디테일
            </div>
            <div style={{ fontSize: 12, lineHeight: 1.6, color: '#666' }}>
              · tabular-nums + letter-spacing<br/>
              · kicker / title / body 3단 위계<br/>
              · BSO 도트 · 다이아몬드 재디자인<br/>
              · 이모지 ❤/⚾ 최소화, 의미 있을 때만
            </div>
          </DCArtboard>
          <DCArtboard label="개인화" width={320} height={220} style={{ background: '#fff', padding: 22 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: '#888', letterSpacing: 1, textTransform: 'uppercase', marginBottom: 10 }}>PERSONALIZE</div>
            <div style={{ fontSize: 16, fontWeight: 700, color: '#222', lineHeight: 1.4, marginBottom: 10, letterSpacing: -0.3 }}>
              내 팀이 앱의 주인공
            </div>
            <div style={{ fontSize: 12, lineHeight: 1.6, color: '#666' }}>
              · 히어로 그라데이션 · 로고 워터마크<br/>
              · 강조 링크·CTA = 팀 컬러<br/>
              · 순위표 내 팀 행 하이라이트<br/>
              · 컬러 강도 0~10 슬라이더로 조절
            </div>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
