name: Badge Card Wordwrap Gate

# 프로필 배지 카드의 배지명이 모바일 폭에서 어절 중간에 쪼개지지 않는지 fail-closed 로 잠근다.
#
# 배경(2026-08-03 Production 사고): `크보팬 전속가수` 가 320px 에서 `전속/가수`,
# `크보/팬` 으로 쪼개졌는데 소스 문자열만 보던 smoke 는 GREEN 이었다.
# 소스에 `wordBreak: keep-all` 이 있어도 칸 폭이 모자라면 실제 렌더는 깨진다.
# 그래서 이 게이트는 실제 Chromium 에서 line box 를 측정한다.
#
# Vercel prebuild 는 Chromium 이 없어 graceful skip 되므로, 실제 강제는 이 워크플로가 맡는다
# (BADGE_WORDWRAP_REQUIRE_BROWSER=1 → 브라우저 없으면 exit 1).
on:
  # 배지 카탈로그·카드 컴포넌트·글로벌 스타일 어디가 바뀌어도 레이아웃이 깨질 수 있고,
  # paths allowlist 는 새 의존 추가 때 workflow 를 통째로 SKIP 시켜 trigger false-green 을
  # 만든다. 모든 PR 에서 실행한다.
  pull_request:
  push:
    branches:
      - main

jobs:
  badge-card-wordwrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prove the gate is RED without Chromium
        run: |
          missing="$(mktemp -d)"
          if PLAYWRIGHT_BROWSERS_PATH="$missing" BADGE_WORDWRAP_REQUIRE_BROWSER=1 \
             npm run qa:badge-card-wordwrap; then
            echo "FAIL: gate passed without Chromium"
            exit 1
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prove the gate is RED when the column fix is reverted
        # 게이트가 실제 회귀를 잡는지 CI 안에서 증명한다. 통과해버리면 그 즉시 실패.
        # grid: 반응형 열 수를 사고 당시(항상 4열)로 되돌림 → 320px 어절 분절
        env:
          BADGE_WORDWRAP_REQUIRE_BROWSER: "1"
          BADGE_WORDWRAP_MUTATE: "grid"
        run: |
          if npm run qa:badge-card-wordwrap; then
            echo "FAIL: gate passed even though the responsive column fix was reverted (false-green)"
            exit 1
          fi
          git diff --exit-code -- src/components/profile/BadgesTab.tsx

      - name: Prove the gate is RED on an unreadable font
        # font: 배지명을 1~2px 로 줄임 → computed font-size 계약으로 RED 여야 한다.
        # (이전 판본은 분절/overflow 만 봐서 읽을 수 없는 폰트도 GREEN 이었다 — 삼순 NO-GO)
        env:
          BADGE_WORDWRAP_REQUIRE_BROWSER: "1"
          BADGE_WORDWRAP_MUTATE: "font"
        run: |
          if npm run qa:badge-card-wordwrap; then
            echo "FAIL: gate passed with a 1-2px badge name (computed font-size contract missing)"
            exit 1
          fi
          git diff --exit-code -- src/components/profile/BadgesTab.tsx

      - name: Lint regression harness
        run: npx eslint --max-warnings=0 scripts/qa/badge-card-wordwrap-browser.mjs

      - name: Run badge card wordwrap gate
        env:
          BADGE_WORDWRAP_REQUIRE_BROWSER: "1"
        run: npm run qa:badge-card-wordwrap
