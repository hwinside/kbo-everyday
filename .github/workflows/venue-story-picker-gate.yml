name: Venue Story Picker Gate

# 직관 라이브 스토리 픽커/뷰어 게이트 (삼순 #1063 NO-GO — required CI 결속).
#
# 배경: qa:venue-multi-pick(필터 전환 race 포함)과 qa:venue-story-video-poster 가
# package.json 에만 있고 어떤 워크플로에서도 호출되지 않아, 배선이 깨져도 기존 필수
# 체크(game-log-ledger / venue-stats-s2)는 GREEN 인 false-green 상태였다.
#
# 이 게이트는 Composer/Viewer/네이티브 브릿지·플러그인·해당 QA 스크립트가 바뀔 때
# fail-closed 로 돈다. generation/pending reload 가드나 poster 배선을 제거하면
# 이 job 이 실제로 RED 가 되어야 한다(결함주입으로 확인).
#
# ⚠️ GitHub Actions 워크플로 파서는 YAML anchor/alias 를 지원하지 않는다 —
# pull_request / push paths 는 중복이지만 반드시 그대로 나열해야 한다.

on:
  pull_request:
    paths:
      - "src/components/game/VenueStoryComposer.tsx"
      - "src/components/game/VenueStoryViewer.tsx"
      - "src/components/game/VenueLibraryGrid.tsx"
      - "src/lib/venue-stories/**"
      - "src/lib/capacitor/venue-media-library.ts"
      - "ios/App/App/VenueMediaLibraryPlugin.swift"
      - "ios/App/App/Info.plist"
      - "ios/App/App/MainViewController.swift"
      - "ios/App/App.xcodeproj/project.pbxproj"
      - "android/app/src/main/java/fan/keubo/app/VenueMediaLibraryPlugin.kt"
      - "android/app/src/main/java/fan/keubo/app/MainActivity.java"
      - "android/app/src/main/AndroidManifest.xml"
      - "scripts/qa/venue-multi-pick-smoke.ts"
      - "scripts/qa/venue-story-video-poster-smoke.ts"
      - "scripts/qa/venue-video-normalize-e2e.mjs"
      - "scripts/qa/venue-transcode-worker-smoke.ts"
      - "scripts/qa/venue-worker-cli-exit-smoke.mjs"
      - "scripts/qa/venue-workflow-trigger-guard.mjs"
      - "scripts/qa/venue-validate-smoke.ts"
      - "scripts/qa/venue-media-smoke.ts"
      - "scripts/qa/venue-story-views.sh"
      - "scripts/qa/venue-story-view-client-smoke.ts"
      - "scripts/qa/venue-story-view-route-smoke.ts"
      - "src/app/api/venue-stories/[id]/view/route.ts"
      - "scripts/venue-transcode-job.mjs"
      - "scripts/transcode-videos.mjs"
      - "eslint.config.mjs"
      - "package.json"
      - ".github/workflows/venue-story-picker-gate.yml"
  push:
    branches:
      - main
    paths:
      - "src/components/game/VenueStoryComposer.tsx"
      - "src/components/game/VenueStoryViewer.tsx"
      - "src/components/game/VenueLibraryGrid.tsx"
      - "src/lib/venue-stories/**"
      - "src/lib/capacitor/venue-media-library.ts"
      - "ios/App/App/VenueMediaLibraryPlugin.swift"
      - "ios/App/App/Info.plist"
      - "ios/App/App/MainViewController.swift"
      - "ios/App/App.xcodeproj/project.pbxproj"
      - "android/app/src/main/java/fan/keubo/app/VenueMediaLibraryPlugin.kt"
      - "android/app/src/main/java/fan/keubo/app/MainActivity.java"
      - "android/app/src/main/AndroidManifest.xml"
      - "scripts/qa/venue-multi-pick-smoke.ts"
      - "scripts/qa/venue-story-video-poster-smoke.ts"
      - "scripts/qa/venue-video-normalize-e2e.mjs"
      - "scripts/qa/venue-transcode-worker-smoke.ts"
      - "scripts/qa/venue-worker-cli-exit-smoke.mjs"
      - "scripts/qa/venue-workflow-trigger-guard.mjs"
      - "scripts/qa/venue-validate-smoke.ts"
      - "scripts/qa/venue-media-smoke.ts"
      - "scripts/qa/venue-story-views.sh"
      - "scripts/qa/venue-story-view-client-smoke.ts"
      - "scripts/qa/venue-story-view-route-smoke.ts"
      - "src/app/api/venue-stories/[id]/view/route.ts"
      - "scripts/venue-transcode-job.mjs"
      - "scripts/transcode-videos.mjs"
      - "eslint.config.mjs"
      - "package.json"
      - ".github/workflows/venue-story-picker-gate.yml"

jobs:
  venue-story-picker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint venue story picker surface (fail-closed, warnings blocked)
        # --max-warnings=0 → react-hooks 경고 1건도 check 실패로 이어진다.
        run: >-
          npx eslint --max-warnings=0
          src/components/game/VenueStoryComposer.tsx
          src/components/game/VenueStoryViewer.tsx
          src/components/game/VenueLibraryGrid.tsx
          src/lib/venue-stories
          src/lib/capacitor/venue-media-library.ts
          scripts/qa/venue-multi-pick-smoke.ts
          scripts/qa/venue-story-video-poster-smoke.ts
          scripts/qa/venue-video-normalize-e2e.mjs
          scripts/qa/venue-transcode-worker-smoke.ts
          scripts/qa/venue-worker-cli-exit-smoke.mjs
          scripts/qa/venue-workflow-trigger-guard.mjs
          scripts/qa/venue-validate-smoke.ts
          scripts/qa/venue-media-smoke.ts
          scripts/qa/venue-story-view-client-smoke.ts
          scripts/qa/venue-story-view-route-smoke.ts
          scripts/transcode-videos.mjs
          scripts/venue-transcode-job.mjs

      - name: Syntax check production workers (.mjs, fail-closed)
        # tsc 는 .mjs 를 안 보고 스모크는 processVenueJob 만 import 하므로,
        # 상위 워커 자체의 문법 오류는 어느 게이트에도 안 잡혔다(삼순 독립 재현 2026-08-04:
        # lint/tsc/smoke 전부 exit 0, node --check 만 exit 1). 파싱 가능성을 명시적으로 검증한다.
        run: |
          node --check scripts/transcode-videos.mjs
          node --check scripts/venue-transcode-job.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run venue picker contract + filter race smoke (fail-closed)
        # 실제 VenueStoryComposer 를 jsdom 에 렌더해 네이티브 브릿지 주입으로
        # 단일/연속 필터 전환 race(generation·pending reload)를 실행 검증한다.
        run: npm run qa:venue-multi-pick

      - name: Run venue story viewer poster smoke (fail-closed)
        # 실제 VenueStoryViewer 를 렌더해 poster/preload DOM 속성을 직접 읽는다.
        run: npm run qa:venue-story-video-poster

      - name: Run venue media limit + mp4 box smoke (fail-closed)
        run: npm run qa:venue-media

      - name: Ensure local PostgreSQL for view RPC regression (fail-closed)
        # venue-story-views.sh 는 initdb/psql 부재 시 exit 2(SKIP)로 떨어진다 —
        # 러너에 pg 바이너리를 PATH 에 올려 SKIP 자체를 불가능하게 만든다.
        # ubuntu-latest 는 postgresql 이 설치돼 있어도 /usr/lib/postgresql/*/bin 이
        # PATH 밖이다. 없으면 설치하고, 그래도 없으면 job 을 떨어뜨린다(fail-closed).
        run: |
          if ! command -v initdb >/dev/null; then
            PGBIN=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1 || true)
            if [ -z "$PGBIN" ]; then
              sudo apt-get update
              sudo apt-get install -y postgresql
              PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
            fi
            [ -x "$PGBIN/initdb" ] || { echo "initdb not found"; exit 1; }
            echo "$PGBIN" >> "$GITHUB_PATH"
            "$PGBIN/initdb" --version
          else
            initdb --version
          fi

      - name: Run venue story view tracking regression (fail-closed)
        # 2026-08-12 조회수 전량 유실 회귀(#1161 — unbound fetch Illegal invocation) 결속.
        # pg RPC dedupe 회귀 + 클라 this-sensitive 전송 계약 + route 실호출 재시도 경로.
        run: npm run qa:venue-story-views

      - name: Run venue video validate + serve-readiness smoke (fail-closed)
        # needs_transcode 후속 큐 판정 + video-validate-server 실배선(realDeps) 검증.
        run: npm run qa:venue-validate

      - name: Ensure ffmpeg/ffprobe (worker + normalize e2e)
        # 서버 워커 실 ffmpeg 계약(U)과 정규화 e2e 가 둘 다 실바이너리를 쓴다.
        # 반드시 두 스모크**보다 앞**에 있어야 한다(2026-08-04: worker 스모크가 먼저 돌아
        # ffmpeg 부재로 FAIL 했다). ubuntu-latest 러너엔 기본 탑재가 아니라 설치한다.
        # 설치 후에도 없으면 스킵하지 않고 job 을 떨어뜨린다(fail-closed).
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Run venue transcode worker CAS smoke (fail-closed)
        # archived+needs_transcode 최적화 경로 · 재시도 소진 · resurrect 금지 CAS
        # + orchestration seam 행동 + 서버 워커 실 ffmpeg 720p/faststart/회전 계약.
        run: npm run qa:venue-transcode-worker

      - name: Install Playwright chromium (video normalize e2e)
        run: npx playwright install --with-deps chromium

      - name: Run venue video normalize e2e (fail-closed)
        # 실제 prepareVenueStoryMedia() 를 실행하고 storage.upload 로 들어온 실제 바이트를
        # ffprobe/박스파서로 검사한다. 정규화 호출을 무력화하면 이 스텝이 RED 가 된다.
        run: npm run qa:venue-video-normalize

      - name: Verify gate self-trigger wiring (fail-closed)
        # required workflow 가 실행하는 QA 스크립트가 이 workflow 의 paths/lint 에 없으면,
        # 그 스크립트만 약화시키는 PR 이 check 를 아예 트리거하지 않고 머지된다.
        # 실제 YAML 파서로 paths/lint 를 읽어 역추적 결속을 확인한다(자체 파싱 금지).
        run: npm run qa:venue-workflow-trigger

      - name: Run venue worker CLI exit-code smoke (fail-closed)
        # 워커를 **진짜 subprocess** 로 돌려 main IIFE 가 실패를 exit 1 로 올리는지 본다.
        # helper/sentinel 만 in-process 로 보면 `if (false && venueRunHasFailure(...))` 가
        # 통과해 cron 이 실패를 삼킨 채 거짓 성공으로 끝난다(삼순 R6 ③).
        run: npm run qa:venue-worker-cli-exit
