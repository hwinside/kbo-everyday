name: Roster SSOT Validator

# specs/roster-ssot-fortress.md §3.1
# roster JSON이 변경된 모든 PR에서 SSOT 규칙 검증

on:
  pull_request:
    paths:
      - "src/lib/constants/players-roster.json"
      - "scripts/validate-player-identity.mjs"
      - "src/lib/utils/resolve-player.ts"
      - "src/lib/utils/player-roster.ts"
      - "src/lib/constants/stats-2026-pitchers.json"
      - "src/lib/constants/stats-2026-batters.json"
      - "src/lib/constants/player-photos.ts"
      - "src/lib/constants/foreign-id-map.ts"
      - "src/lib/constants/hero-approved-kboids.json"
      - "public/players/**"
      - "public/players-hero/**"
      - "scripts/validate-roster.mjs"
      - "scripts/qa/foreign-photo-coverage.ts"
      - "scripts/qa/dup-name-photo-smoke.ts"
      - ".github/workflows/validate-roster.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/constants/players-roster.json"
      - "scripts/validate-player-identity.mjs"
      - "src/lib/utils/resolve-player.ts"
      - "src/lib/utils/player-roster.ts"
      - "src/lib/constants/stats-2026-pitchers.json"
      - "src/lib/constants/stats-2026-batters.json"
      - "src/lib/constants/player-photos.ts"
      - "src/lib/constants/foreign-id-map.ts"
      - "src/lib/constants/hero-approved-kboids.json"
      - "public/players/**"
      - "public/players-hero/**"
      - "scripts/validate-roster.mjs"
      - "scripts/qa/foreign-photo-coverage.ts"
      - "scripts/qa/dup-name-photo-smoke.ts"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run roster validator
        env:
          # PR body / commit message에 "roster-size-change" 포함 시 선수 수 변경 허용
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: node scripts/validate-roster.mjs

      - name: Run player identity validator
        run: node scripts/validate-player-identity.mjs

      - name: Run foreign player photo coverage gate
        # specs/roster-ssot-fortress.md §3.2
        # 외국인 30명 × 5 ID 변형 + hero approved 28명에 대해 resolver/photo/파일 일관성 강제.
        # 어떤 외국인이라도 1개 변형에서 사진이 안 잡히면 fail → 머지 차단.
        run: npm run qa:foreign-photo

      - name: Run duplicate-name photo gate
        # 2026-08-20 CS 제보(#1269): 동명이인 name-only 사진맵 fallback fail-close +
        # positionHint 역할 분리. 로스터/사진맵이 바뀌어 동명이인 계약이 깨지면 머지 차단.
        run: npm run qa:dup-name-photo
