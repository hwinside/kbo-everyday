name: Result Tone SSOT Gate

# 승패·긍정/부정 컬러톤 SSOT 게이트.
#
# 왜 별도 워크플로인가 — 기존 게이트가 이 축에서 false-green 이었다(삼순 #1068 Blocker 2):
#   RESULT_TONE_COLOR 의 positive/negative 를 서로 바꿔도
#   ui-contrast-gate(qa:diary-contrast)·venue-stats-s2-gate 가 둘 다 PASS 했다.
#   - 전자: fixture 가 games=[] 라 결과 칩을 아예 렌더하지 않음
#   - 후자: 대비(contrast)만 보므로 승/패가 뒤집혀도 대비값은 그대로
#   그리고 두 워크플로 paths 어디에도 src/lib/ui/result-tone.ts 가 없어
#   SSOT 파일만 고치면 required check 가 아예 돌지도 않았다.
#
# 이 워크플로는 팔레트 exact · W/L/D 의미 매핑 · 기준 화면(홈 TeamCard)과
# 소비자 실제 DOM 배선을 fail-closed 로 검증한다.

on:
  pull_request:
    paths:
      - "src/lib/ui/result-tone.ts"
      - "src/components/home/TeamCard.tsx"
      - "src/components/my/VenueDiaryCard.tsx"
      - "src/components/my/VenueDiaryAddGameSheet.tsx"
      - "src/components/my/VenueDiaryUploader.tsx"
      - "src/components/my/VenueDiaryViewer.tsx"
      - "src/components/my/VenueStatsDashboard.tsx"
      - "src/components/player/PlayerGameLogs.tsx"
      - "src/components/game/GameStatsTab.tsx"
      - "src/components/game/GameDecisionPitchers.tsx"
      - "src/components/team/TeamHero.tsx"
      - "src/components/team/TeamRosterMovesCard.tsx"
      - "src/components/stats/TeamDashboard.tsx"
      - "src/app/(main)/teams/[teamId]/schedule/page.tsx"
      - "scripts/qa/result-tone-gate.mjs"
      - "scripts/qa/venue-diary-games-fold.mjs"
      - "scripts/qa/fixtures/venue-stats-scope.mjs"
      - "scripts/qa/venue-stats-s2-browser.mjs"
      - "src/styles/globals.css"
      - "package.json"
      - ".github/workflows/result-tone-gate.yml"
      - "src/components/ui/TabBar.tsx"
      - "src/components/ui/HeaderProfileLink.tsx"
      - "src/components/home/CommunityLatestPosts.tsx"
      - "src/components/home/HomeClientShell.tsx"
      - "src/components/home/MyTeamHero.tsx"
      - "src/components/home/TodayGamesSection.tsx"
      - "src/components/home/AllStarGameCard.tsx"
      - "src/components/game/CompactGameCard.tsx"
      - "src/app/(main)/layout.tsx"
      - "scripts/qa/rsc-prefetch-budget-gate.mjs"
  push:
    branches:
      - main
    paths:
      - "src/lib/ui/result-tone.ts"
      - "src/components/home/TeamCard.tsx"
      - "src/components/my/VenueDiaryCard.tsx"
      - "src/components/my/VenueDiaryAddGameSheet.tsx"
      - "src/components/my/VenueDiaryUploader.tsx"
      - "src/components/my/VenueDiaryViewer.tsx"
      - "src/components/my/VenueStatsDashboard.tsx"
      - "src/components/player/PlayerGameLogs.tsx"
      - "src/components/game/GameStatsTab.tsx"
      - "src/components/game/GameDecisionPitchers.tsx"
      - "src/components/team/TeamHero.tsx"
      - "src/components/team/TeamRosterMovesCard.tsx"
      - "src/components/stats/TeamDashboard.tsx"
      - "src/app/(main)/teams/[teamId]/schedule/page.tsx"
      - "scripts/qa/result-tone-gate.mjs"
      - "scripts/qa/venue-diary-games-fold.mjs"
      - "scripts/qa/fixtures/venue-stats-scope.mjs"
      - "scripts/qa/venue-stats-s2-browser.mjs"
      - "src/styles/globals.css"
      - "package.json"
      - ".github/workflows/result-tone-gate.yml"
      - "src/components/ui/TabBar.tsx"
      - "src/components/ui/HeaderProfileLink.tsx"
      - "src/components/home/CommunityLatestPosts.tsx"
      - "src/components/home/HomeClientShell.tsx"
      - "src/components/home/MyTeamHero.tsx"
      - "src/components/home/TodayGamesSection.tsx"
      - "src/components/home/AllStarGameCard.tsx"
      - "src/components/game/CompactGameCard.tsx"
      - "src/app/(main)/layout.tsx"
      - "scripts/qa/rsc-prefetch-budget-gate.mjs"

jobs:
  result-tone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint result tone surface (fail-closed, warnings blocked)
        run: npx eslint --max-warnings=0 src/lib/ui/result-tone.ts scripts/qa/result-tone-gate.mjs scripts/qa/venue-diary-games-fold.mjs scripts/qa/fixtures/venue-stats-scope.mjs scripts/qa/venue-stats-s2-browser.mjs src/components/home/TeamCard.tsx src/components/my/VenueDiaryCard.tsx src/components/my/VenueDiaryAddGameSheet.tsx src/components/my/VenueDiaryUploader.tsx src/components/my/VenueDiaryViewer.tsx src/components/my/VenueStatsDashboard.tsx src/components/player/PlayerGameLogs.tsx src/components/game/GameStatsTab.tsx src/components/game/GameDecisionPitchers.tsx src/components/team/TeamHero.tsx src/components/team/TeamRosterMovesCard.tsx src/components/stats/TeamDashboard.tsx 'src/app/(main)/teams/[teamId]/schedule/page.tsx'

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run result tone SSOT gate (fail-closed)
        # RESULT_TONE_REQUIRE_BROWSER=1 → chromium 미설치/launch 실패도 exit 1.
        env:
          RESULT_TONE_REQUIRE_BROWSER: "1"
        run: npm run qa:result-tone

      - name: Prove gate catches semantic color inversion (mutation RED)
        # 승/패 색을 역전시켰을 때 게이트가 반드시 실패해야 한다.
        # 여기서 통과해 버리면 위 GREEN 은 아무것도 증명하지 못한다.
        env:
          RESULT_TONE_REQUIRE_BROWSER: "1"
          RESULT_TONE_MUTATE_SWAP: "1"
        run: |
          if npm run qa:result-tone; then
            echo "::error::색 역전 mutation 이 통과했다 — 게이트가 false-green 이다"
            exit 1
          fi
          echo "mutation RED 확인: 색 역전이 게이트에 걸린다"

      - name: Prove gate catches consumer unwiring (mutation RED)
        # 각 소비자를 하드코딩 시절로 되돌리면 반드시 실패해야 한다.
        env:
          RESULT_TONE_REQUIRE_BROWSER: "1"
        run: |
          for target in teamcard diary playerlogs schedule roster homemoves teamdashboard addsheet uploader viewer dashboard compatswap metriccard scoreaxis gamestats teamhero decision; do
            if RESULT_TONE_MUTATE_UNWIRE="$target" npm run qa:result-tone; then
              echo "::error::$target 배선 제거가 통과했다 — 해당 화면은 SSOT 에 결속돼 있지 않다"
              exit 1
            fi
            echo "mutation RED 확인: $target 배선 제거가 게이트에 걸린다"
          done

      # ── 직관 다이어리 경기별 기록 fold (PR #1085) ──────────────────────────
      #
      # 왜 이 워크플로에 얹는가: fold 게이트는 실제 Chromium 렌더가 있어야 의미가 있는데,
      # Vercel prebuild 에는 Chromium 이 없어 `SKIP ... exit 0` 으로 조용히 통과한다.
      # 실제로 배포가 SUCCESS 였다(삼순 판정). 여기는 이미 Chromium 을 설치하는
      # required job 이므로 별도 워크플로를 새로 만들지 않고 같은 job 에서 결속한다.
      - name: Run venue diary games fold gate (fail-closed)
        # VENUE_DIARY_FOLD_REQUIRE_BROWSER=1 → chromium 미설치/launch 실패도 exit 1.
        # 이게 없으면 SKIP exit 0 이 그대로 GREEN 이 된다(이 PR 이 잡으려는 사고 그 자체).
        run: npm run qa:venue-diary-games-fold:required

      - name: Prove fold gate catches default-open / always-render (mutation RED)
        # baseline GREEN 만으로는 검증력을 증명하지 못한다.
        # 기본 접힘이 풀리거나(default-open) 접힌 상태에서도 목록을 렌더하면(always-render)
        # 반드시 RED 여야 한다.
        run: |
          for target in default-open always-render; do
            if VENUE_DIARY_FOLD_MUTATE="$target" npm run qa:venue-diary-games-fold:required; then
              echo "::error::$target mutation 이 통과했다 — fold 게이트가 false-green 이다"
              exit 1
            fi
            echo "mutation RED 확인: $target 이 fold 게이트에 걸린다"
          done
          # mutation 은 소스를 메모리에서만 변조해야 한다. 작업트리가 더러워졌으면
          # 변조본이 빌드로 새어들 수 있으므로 fail-close 한다.
          git diff --exit-code

      # ── _rsc prefetch 예산 (PR #1115 재작성) ─────────────────────────────
      #
      # 왜 이 워크플로에 얹는가: 이 게이트는 production build 를 띄우고 실제 Chromium 으로
      # `_rsc` 요청 수를 세야 의미가 있다. Vercel prebuild 에는 Chromium 이 없어
      # `SKIP exit 0` 으로 조용히 통과한다(위 fold 게이트와 같은 사고 축).
      # 여기는 이미 Chromium 을 설치하는 required job 이므로 같은 job 에 결속한다.
      #
      # 직전 판(삼순 NO-GO)은 소스 문자열만 스캔해서, 신규 Link mutation 이
      # `// <Link ...>` 주석 한 줄을 세는 가짜 RED 였다. 그래서 실브라우저 측정으로 바꿨다.
      - name: Build for RSC prefetch budget gate
        # ⚠️ 시크릿이 없으면 `next build` 가 라우트 page-data 수집에서 죽는다(로컬 CI 재현 실측:
        # `Failed to collect page data for /api/admin/downloads`). 빌드가 죽으면 이 게이트는
        # 아예 돌지 못하므로, repo secrets 를 주입해 CI 에서 실제로 빌드되게 한다.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: SKIP_PREBUILD=1 npx next build

      - name: Run _rsc prefetch budget gate (fail-closed)
        # --require-browser → chromium 미설치/launch 실패도 exit 1.
        env:
          RSC_GATE_PORT: "3971"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        # ⚠️ npm alias(`npm run qa:...`) 를 쓰지 않는다(삼순 NO-GO 2026-08-05 2차).
        # package.json alias 를 `git diff --quiet` 같은 것으로 바꿔치면 브라우저를 한 번도
        # 안 띄우고도 baseline 0 / dirty mutation nonzero 로 통과한다(#1085 와 같은 축).
        # 스크립트 경로를 직접 호출해 alias 를 신뢰 경계에서 제거한다.
        run: node scripts/qa/rsc-prefetch-budget-gate.mjs --require-browser

      - name: Prove rsc gate catches prefetch regression (mutation RED)
        # 소스에서 prefetch={false} 를 되돌리고 **재빌드**한 뒤 실브라우저로 측정한다.
        # 주석이 아니라 실제 렌더 트리의 Link 가 prefetch 를 다시 켜야만 RED 가 된다.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          set -e
          mutate() {
            python3 - "$1" "$2" <<'PYEOF'
          import sys
          f, mode = sys.argv[1], sys.argv[2]
          s = open(f).read()
          out = s.replace("<Link prefetch={false}", "<Link") if mode == "off" \
                else s.replace("prefetch={false}", "prefetch={true}")
          if out == s:
              print(f"::error::mutation anchor 불일치: {f} ({mode}) — 변형이 일어나지 않았다")
              sys.exit(2)
          open(f, "w").write(out)
          PYEOF
          }
          # set -e 하에서 mutate/build/gate 어느 단계가 죽어도 변조본이 남으면 안 된다.
          # trap 으로 무조건 원본을 되돌린다(이게 없어 실제로 트리가 오염된 적 있다).
          CURRENT_MUT_FILE=""
          restore_mut() {
            if [ -n "$CURRENT_MUT_FILE" ] && [ -f /tmp/rsc-mut-backup ]; then
              cp /tmp/rsc-mut-backup "$CURRENT_MUT_FILE"
              echo "trap: $CURRENT_MUT_FILE 원본 복원"
            fi
          }
          trap restore_mut EXIT
          for spec in "src/components/ui/TabBar.tsx:off" "src/components/home/CommunityLatestPosts.tsx:off" "src/components/home/TodayGamesSection.tsx:true"; do
            f="${spec%:*}"; mode="${spec##*:}"
            cp "$f" /tmp/rsc-mut-backup
            CURRENT_MUT_FILE="$f"
            mutate "$f" "$mode"
            SKIP_PREBUILD=1 npx next build
            # exit 20(예산 초과)만 RED 로 인정한다. 0=통과, 30=harness 실패
            # (포트 점유·서버 조기종료·buildId 불일치·Chromium 부재)는 둘 다 job 실패로 본다.
            # "nonzero 면 RED" 로 세면 측정이 안 됐는데도 검증력이 있다고 착각한다(삼순 2차 지적).
            # npm alias 를 쓰지 않고 스크립트를 직접 호출한다(alias 바꿔치기 decoy 차단).
            set +e
            RSC_GATE_PORT=3971 node scripts/qa/rsc-prefetch-budget-gate.mjs --require-browser
            code=$?
            set -e
            cp /tmp/rsc-mut-backup "$f"
            CURRENT_MUT_FILE=""
            if [ "$code" -eq 0 ]; then
              echo "::error::$f ($mode) mutation 이 통과했다(exit 0) — rsc 게이트가 false-green 이다"
              exit 1
            fi
            if [ "$code" -ne 20 ]; then
              echo "::error::$f ($mode) 가 harness 실패(exit $code) — 측정 자체가 안 됐다. RED 로 인정하지 않는다"
              exit 1
            fi
            cp /tmp/rsc-mut-backup "$f"
            CURRENT_MUT_FILE=""
            echo "mutation RED 확인: $f ($mode) 가 rsc 게이트에 걸린다"
          done
          trap - EXIT
          # 변조본이 남아 빌드로 새어들면 안 된다.
          git diff --exit-code
