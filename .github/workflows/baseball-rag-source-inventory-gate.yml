name: Baseball RAG Source Inventory Gate

# 야잘알봇 v2 RAG source inventory 게이트.
# prebuild(Vercel)는 DB 없이 도는 경로라 PG17 결함주입을 실행할 수 없다. 이 워크플로가 실제 자동 gate 다:
#   1) inventory 결정론 / KBO universe coverage / canonical 계약 (qa:baseball-source-inventory)
#   2) 생성기 drift 0 (재생성 후 git diff --exit-code)
#   3) 실제 PostgreSQL 17 에서 DDL/RPC/fail-close 결함주입 + 932행 idempotent seed
# 결함주입이 통과해버리면(false-green) 스크립트가 exit 1 로 죽는다.

on:
  pull_request:
    paths:
      - "src/lib/baseball-qa/**"
      - "data/baseball-qa/source-inventory.json"
      - "scripts/baseball-qa/**"
      - "scripts/qa/baseball-qa-source-inventory-smoke.ts"
      - "scripts/qa/baseball-qa-source-inventory-pg17.sh"
      - "scripts/qa/baseball-qa-rag-contract-smoke.ts"
      - "supabase/migrations/20260731_baseball_genius_rag_sources.sql"
      - "supabase/migrations/20260731_baseball_genius_rag_sources_seed.sql"
      - "specs/baseball-genius-v2-hybrid-rag.md"
      - "package.json"
      - ".github/workflows/baseball-rag-source-inventory-gate.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/baseball-qa/**"
      - "data/baseball-qa/source-inventory.json"
      - "scripts/baseball-qa/**"
      - "scripts/qa/baseball-qa-source-inventory-smoke.ts"
      - "scripts/qa/baseball-qa-source-inventory-pg17.sh"
      - "scripts/qa/baseball-qa-rag-contract-smoke.ts"
      - "supabase/migrations/20260731_baseball_genius_rag_sources.sql"
      - "supabase/migrations/20260731_baseball_genius_rag_sources_seed.sql"
      - "specs/baseball-genius-v2-hybrid-rag.md"
      - "package.json"
      - ".github/workflows/baseball-rag-source-inventory-gate.yml"

jobs:
  baseball-rag-source-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint source inventory surface (fail-closed, warnings blocked)
        run: >-
          npx eslint --max-warnings=0
          src/lib/baseball-qa
          scripts/baseball-qa
          scripts/qa/baseball-qa-source-inventory-smoke.ts
          scripts/qa/baseball-qa-rag-contract-smoke.ts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Inventory contract smoke (universe coverage + canonical + fail-close)
        run: npm run qa:baseball-source-inventory

      - name: RAG contract smoke
        run: npm run qa:baseball-rag-contract

      - name: Inventory generator must be deterministic (no drift)
        # 생성기를 다시 돌려도 committed inventory/seed 와 1비트도 달라지면 안 된다.
        run: |
          npm run build:baseball-source-inventory
          git diff --exit-code -- data/baseball-qa/source-inventory.json supabase/migrations/20260731_baseball_genius_rag_sources_seed.sql

      - name: Install PostgreSQL 17
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-17 || sudo apt-get install -y postgresql
          ls /usr/lib/postgresql

      - name: PG17 DDL/RPC fault-injection + idempotent seed gate (fail-closed)
        # PGBIN 을 우분투 경로로 넘긴다. 바이너리가 없으면 스크립트가 SKIP 하므로
        # 여기서 존재를 먼저 확인해 조용한 skip(false-green)을 막는다.
        run: |
          PGBIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          echo "using PGBIN=$PGBIN"
          test -x "$PGBIN/initdb" || { echo "FAIL: initdb not found — gate would silently skip"; exit 1; }
          PGBIN="$PGBIN" npm run qa:baseball-source-inventory:db
