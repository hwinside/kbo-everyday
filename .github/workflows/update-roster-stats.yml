name: Update Roster & Stats

on:
  schedule:
    # 매일 새벽 5시 KST (UTC 20:00 전일)
    - cron: '0 20 * * *'
  workflow_dispatch: # 수동 실행 가능

permissions:
  contents: write
  pull-requests: write

# 삼순 CODE NO-GO(축③): 겹친 두 런이 각자 PR 을 만든 뒤 서로 상대 신규 PR 을 닫는 경합을
# 막기 위해 런을 직렬화한다. cancel-in-progress:false — 진행 중인 크롤/머지를 죽이지 않고
# 대기시켜 순차 실행한다(데이터 손실 방지).
concurrency:
  group: update-roster-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 자동 머지 급변 가드용 기준값: 크롤 *이전*(= main 현재) roster/batters/pitchers 인원 수
      - name: Baseline counts (main)
        id: baseline
        run: |
          jlen() { node -e "console.log(JSON.parse(require('fs').readFileSync('$1','utf-8')).length)"; }
          klen() { node -e "console.log(Object.keys(JSON.parse(require('fs').readFileSync('$1','utf-8'))).length)"; }
          ROSTER=$(jlen src/lib/constants/players-roster.json)
          BATTERS=$(jlen src/lib/constants/stats-2026-batters.json)
          PITCHERS=$(jlen src/lib/constants/stats-2026-pitchers.json)
          DEFENSE=$(jlen src/lib/constants/stats-2026-defense.json)
          DEFENSE_RUNS=$(klen src/lib/constants/player-defense-runs.json)
          echo "roster_count=$ROSTER" >> $GITHUB_OUTPUT
          echo "batter_count=$BATTERS" >> $GITHUB_OUTPUT
          echo "pitcher_count=$PITCHERS" >> $GITHUB_OUTPUT
          echo "defense_count=$DEFENSE" >> $GITHUB_OUTPUT
          echo "defense_runs_count=$DEFENSE_RUNS" >> $GITHUB_OUTPUT
          echo "Baseline: roster=$ROSTER batters=$BATTERS pitchers=$PITCHERS defense=$DEFENSE defense_runs=$DEFENSE_RUNS"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Crawl roster
        run: node scripts/crawl-roster-v2.mjs

      - name: Normalize roster schema
        run: |
          node -e "
            const fs = require('fs');
            const path = 'src/lib/constants/players-roster.json';
            const data = JSON.parse(fs.readFileSync(path, 'utf-8'));
            for (const p of data) {
              if (!p.team && p.teamName) p.team = p.teamName;
              for (const k of Object.keys(p)) {
                if (!['name','kboId','team','teamId','position','backNo','birthDate'].includes(k)) delete p[k];
              }
            }
            fs.writeFileSync(path, JSON.stringify(data, null, 2));
            console.log('Normalized', data.length, 'entries');
          "

      - name: Crawl 2026 stats
        run: node scripts/crawl-stats.mjs --season 2026

      # 재발 방지: 크롤된 stats 에는 있으나 roster 에 없는 선수(상무 전역 복귀/콜업)를
      # KBO 공식 상세에서 자동 온보딩한다. 사진은 다음 스텝(update-player-photos)이
      # roster 기준으로 자동 다운로드/맵 재생성한다. (2026-07-14 스탯 반영 정지 근본대응)
      - name: Reconcile roster from stats
        # FOREIGN_ONBOARD_WEBHOOK secret 미등록 시 이 슬라이스의 알림 계약은 GHA ::warning::+STEP_SUMMARY만이다
        # (신규 외국인 국적 미등록 알림). secret 등록 시 코드 변경 없이 Slack best-effort POST가 추가로 켜진다.
        env:
          FOREIGN_ONBOARD_WEBHOOK: ${{ secrets.FOREIGN_ONBOARD_WEBHOOK }}
        run: node scripts/reconcile-roster-from-stats.mjs

      - name: Update player photos
        run: node scripts/update-player-photos.mjs

      # P0(2026-08-01): roster 변경에 따른 data inventory만 같은 커밋에서 갱신한다.
      # 런타임 코드와 기존 migration은 자동 크롤이 수정하지 않는다.
      - name: Sync roster-derived artifacts
        run: node scripts/ci/sync-roster-derived-artifacts.mjs

      # P0(삼순 코드리뷰 NO-GO 81149356): reconcile이 이번 실행에 온보딩한 숫자 외국인마다
      # 사진 파일+PLAYER_PHOTO_ID_SET을 실제로 검증한다. CDN 다운로드가 실패해도
      # 이전엔 조용히 넘어갔으므로(사진 0인데 roster엔 정상 등록) non-zero 게이트로 잡는다.
      - name: Validate newly onboarded foreign player photos (P0 gate)
        id: validate_new_foreign_photo
        continue-on-error: true
        run: npm run qa:foreign-onboard-photo-gate

      - name: Validate roster SSOT
        id: validate_roster
        continue-on-error: true
        env:
          ROSTER_SIZE_CHANGE_ACK: "1"
        run: node scripts/validate-roster.mjs

      - name: Validate player identity invariant
        id: validate_identity
        continue-on-error: true
        run: node scripts/validate-player-identity.mjs

      # GITHUB_TOKEN이 만든 PR은 pull_request validate-roster 워크플로를 발화시키지 않으므로
      # foreign-photo 검증도 원본 워크플로 안에서 직접 실행해 자동 머지 게이트에 포함한다.
      - name: Validate foreign photo coverage
        id: validate_photo
        continue-on-error: true
        run: npm run qa:foreign-photo

      - name: Check for changes
        id: changes
        run: |
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            ROSTER_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/lib/constants/players-roster.json','utf-8')).length)")
            BATTER_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/lib/constants/stats-2026-batters.json','utf-8')).length)")
            PITCHER_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/lib/constants/stats-2026-pitchers.json','utf-8')).length)")
            DEFENSE_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src/lib/constants/stats-2026-defense.json','utf-8')).length)")
            DEFENSE_RUNS_COUNT=$(node -e "console.log(Object.keys(JSON.parse(require('fs').readFileSync('src/lib/constants/player-defense-runs.json','utf-8'))).length)")
            echo "roster_count=$ROSTER_COUNT" >> $GITHUB_OUTPUT
            echo "batter_count=$BATTER_COUNT" >> $GITHUB_OUTPUT
            echo "pitcher_count=$PITCHER_COUNT" >> $GITHUB_OUTPUT
            echo "defense_count=$DEFENSE_COUNT" >> $GITHUB_OUTPUT
            echo "defense_runs_count=$DEFENSE_RUNS_COUNT" >> $GITHUB_OUTPUT

            # 생성 데이터 allowlist 검사 — 크롤 단계가 예상 밖 파일(코드/워크플로 등)을
            # 건드렸으면 PR은 생성하되 자동 머지는 보류한다 (#685 삼순 리뷰 Blocker 2)
            # reconcile과 inventory-only sync가 생성하는 data artifact만 허용한다.
            # API/validator 소스, workflow, migration은 내용 검증 없는 경로 allowlist로 열지 않는다.
            ALLOWLIST_RE='^(public/players/[^/]+\.(jpg|jpeg|png|webp)|src/lib/constants/(players-roster\.json|player-photos\.ts|player-defense-runs\.json|foreign-nationality-pending\.json|stats-2026-(batters|pitchers|defense|meta)\.json)|data/baseball-qa/source-inventory\.json)$'
            CHANGED_FILES=$(git diff --cached --name-only)
            OFF_ALLOWLIST=$(echo "$CHANGED_FILES" | grep -Ev "$ALLOWLIST_RE" || true)
            if [ -n "$OFF_ALLOWLIST" ]; then
              echo "off_allowlist=true" >> $GITHUB_OUTPUT
              echo "⚠️ allowlist 밖 변경 파일:"
              echo "$OFF_ALLOWLIST"
              {
                echo "## ⚠️ 생성 allowlist 밖 파일 변경 감지"
                echo ""
                echo '```'
                echo "$OFF_ALLOWLIST"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "off_allowlist=false" >> $GITHUB_OUTPUT
            fi

            # roster/사진/inventory 변경 감지 → 자동 머지 fail-close.
            #
            # 배경(2026-08-04, 삼순 #1098): stats 경로는 KBO 원본 전수 대조 + 완주 계약 +
            # 원자 promote 로 닫았지만, roster 크롤러(crawl-roster-v2.mjs)는 아직 고정 대기 후
            # 페이지 번호만 올리고 그룹 pager 불변 시 조용히 종료한다(quiet EOF).
            # 그 상태로 두면 roster/사진/inventory 변경도 `Δ≤10 + Vercel` 만으로 자동 머지된다.
            # roster 경로가 후속 PR 로 닫힐 때까지, 해당 산출물이 바뀌면 사람이 본다.
            ROSTER_SCOPE_RE='^(public/players/|src/lib/constants/(players-roster\.json|player-photos\.ts|foreign-nationality-pending\.json)|data/baseball-qa/source-inventory\.json)'
            ROSTER_SCOPE_FILES=$(echo "$CHANGED_FILES" | grep -E "$ROSTER_SCOPE_RE" || true)
            if [ -n "$ROSTER_SCOPE_FILES" ]; then
              echo "roster_scope_changed=true" >> $GITHUB_OUTPUT
              echo "⚠️ roster/사진/inventory 변경 감지 — 자동 머지 보류 대상:"
              echo "$ROSTER_SCOPE_FILES"
              {
                echo "## ⚠️ roster/사진/inventory 변경 — 자동 머지 보류"
                echo ""
                echo "roster 크롤러는 아직 완주 계약(bounded retry / quiet EOF 차단)이 없습니다."
                echo "해당 산출물이 바뀐 PR 은 사람이 검토한 뒤 머지하세요."
                echo ""
                echo '```'
                echo "$ROSTER_SCOPE_FILES"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "roster_scope_changed=false" >> $GITHUB_OUTPUT
            fi
          fi

      # PR을 먼저 만들고 나서 freshness를 보는 구조면, 불안정/불일치 스냅샷이
      # 원격 브랜치와 PR로 이미 퍼진다. 생성 전에 같은 wrapper를 직접 fail-close한다.
      - name: Verify fresh stats before creating PR (fail-closed)
        run: node scripts/qa/stats-freshness-verify.mjs

      - name: Create PR
        id: pr
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="auto/update-roster-stats-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "data: roster/stats/photos 자동 업데이트 $(date +%Y-%m-%d)

          - Roster: ${{ steps.changes.outputs.roster_count }}명
          - 타자 스탯: ${{ steps.changes.outputs.batter_count }}명
          - 투수 스탯: ${{ steps.changes.outputs.pitcher_count }}명
          - roster-size-change"

          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "📊 Roster/Stats 자동 업데이트 $(date +%Y-%m-%d)" \
            --body "## 자동 업데이트 (GitHub Actions)

          | 항목 | 수량 |
          |------|------|
          | Roster | ${{ steps.changes.outputs.roster_count }}명 |
          | 타자 스탯 | ${{ steps.changes.outputs.batter_count }}명 |
          | 투수 스탯 | ${{ steps.changes.outputs.pitcher_count }}명 |

          roster-size-change

          검증 결과:
          - Roster SSOT: ${{ steps.validate_roster.outcome }}
          - Player identity: ${{ steps.validate_identity.outcome }}
          - Foreign photo: ${{ steps.validate_photo.outcome }}
          - 신규 온보딩 외국인 사진(P0): ${{ steps.validate_new_foreign_photo.outcome }}

          매일 새벽 5시(KST) 자동 크롤링 결과입니다.
          검증(roster SSOT + player identity)과 Vercel 빌드가 전부 PASS면 자동 머지됩니다.
          검증이 failure면 PR은 open으로 남습니다 — 실패 상태를 확인하고 누락 선수/매핑을 보강한 뒤 수동 머지하세요." \
            --base main \
            --head "$BRANCH")

          echo "PR created: $PR_URL"
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 신규 자동 PR 을 연 뒤, 머지되지 못하고 남은 과거 자동 roster PR 을 close 한다.
      # (best-effort: 실패해도 신규 PR 흐름을 막지 않는다.) 선택 규칙은 순수함수가,
      # close I/O 만 이 스크립트가 맡는다. 반드시 자동 브랜치 접두사로만 제한하고 현재 브랜치는 제외한다.
      - name: Close stale auto roster PRs
        if: steps.changes.outputs.changed == 'true' && steps.pr.outputs.branch != ''
        run: node scripts/ci/close-stale-auto-roster-prs.mjs "$BRANCH"
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report validation failure after PR creation
        if: steps.changes.outputs.changed == 'true' && (steps.validate_roster.outcome == 'failure' || steps.validate_identity.outcome == 'failure' || steps.validate_photo.outcome == 'failure' || steps.validate_new_foreign_photo.outcome == 'failure')
        run: |
          {
            echo "## ❌ 자동 업데이트 검증 실패"
            echo ""
            echo "PR: ${{ steps.pr.outputs.pr_url }}"
            echo "Roster SSOT: ${{ steps.validate_roster.outcome }}"
            echo "Player identity: ${{ steps.validate_identity.outcome }}"
            echo "Foreign photo: ${{ steps.validate_photo.outcome }}"
            echo "신규 온보딩 외국인 사진(P0): ${{ steps.validate_new_foreign_photo.outcome }}"
            echo ""
            echo "PR은 생성했으므로 누락 선수/매핑 보강 후 수동 검토하세요."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Wait for Vercel build and auto-merge
        if: steps.changes.outputs.changed == 'true'
        run: |
          PR_URL="${{ steps.pr.outputs.pr_url }}"
          if [ -z "$PR_URL" ]; then
            echo "No PR URL captured"; exit 0
          fi

          # 운영 원칙 개정 (2026-07-18, 하린아빠 지시):
          # 2026-05-17 #94 사고로 무조건 auto-merge를 제거했으나, 이후 안전망이 생김 —
          #   ① validate-roster / validate-player-identity / foreign-photo (위 스텝, failure면 이전 스텝이 exit 1이라 여기 도달 안 함)
          #   ② 생성 데이터 allowlist (예상 밖 코드/워크플로 파일 변경 시 보류)
          #   ③ 데이터 급변 가드 (roster/batters/pitchers 각 Δ > MAX_DELTA면 크롤 오류 의심 → 보류)
          #   ④ Vercel 빌드 SUCCESS 명시 확인 (아래 loop)
          # 전부 통과할 때만 자동 머지. 하나라도 실패면 PR open + run failure로 남겨
          # 어드민 크롤러 헬스(STALE) 알림 경로로 드러나게 한다.

          # ① 방어적 재확인 (이전 스텝이 게이트하지만 이중 안전핀)
          if [ "${{ steps.validate_roster.outcome }}" != "success" ] || [ "${{ steps.validate_identity.outcome }}" != "success" ] || [ "${{ steps.validate_photo.outcome }}" != "success" ] || [ "${{ steps.validate_new_foreign_photo.outcome }}" != "success" ]; then
            echo "❌ 검증 outcome 비정상 — 자동 머지 보류: $PR_URL"
            exit 1
          fi

          # ② 생성 데이터 allowlist 가드
          if [ "${{ steps.changes.outputs.off_allowlist }}" = "true" ]; then
            {
              echo "## ⚠️ allowlist 밖 파일 변경 — 자동 머지 보류"
              echo ""
              echo "PR: $PR_URL"
              echo "크롤 단계가 생성 데이터 외 파일을 건드렸습니다 — 수동 검토 후 머지하세요."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "❌ allowlist 밖 파일 변경 — 자동 머지 보류: $PR_URL"
            exit 1
          fi

          # ②-b roster/사진/inventory 범위 가드 (삼순 #1098 — roster 완주 계약이 후속 PR 로 분리됨)
          if [ "${{ steps.changes.outputs.roster_scope_changed }}" = "true" ]; then
            {
              echo "## ⚠️ roster/사진/inventory 변경 — 자동 머지 보류"
              echo ""
              echo "PR: $PR_URL"
              echo "roster 크롤러의 완주 계약(bounded retry / quiet EOF 차단)이 아직 없습니다."
              echo "stats-only 변경일 때만 자동 머지합니다 — 이 PR 은 수동 검토 후 머지하세요."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "❌ roster/사진/inventory 변경 — 자동 머지 보류: $PR_URL"
            exit 1
          fi

          # ③ 데이터 급변 가드 (roster/batters/pitchers/defense/defense_runs 각 |Δ| > 10 보류 — 빈 배열 급락 포함 차단)
          MAX_DELTA=10
          GUARD_FAIL=""
          for spec in \
            "roster:${{ steps.baseline.outputs.roster_count }}:${{ steps.changes.outputs.roster_count }}" \
            "batters:${{ steps.baseline.outputs.batter_count }}:${{ steps.changes.outputs.batter_count }}" \
            "pitchers:${{ steps.baseline.outputs.pitcher_count }}:${{ steps.changes.outputs.pitcher_count }}" \
            "defense:${{ steps.baseline.outputs.defense_count }}:${{ steps.changes.outputs.defense_count }}" \
            "defense_runs:${{ steps.baseline.outputs.defense_runs_count }}:${{ steps.changes.outputs.defense_runs_count }}"; do
            NAME="${spec%%:*}"; REST="${spec#*:}"; BEFORE="${REST%%:*}"; AFTER="${REST#*:}"
            DELTA=$((AFTER - BEFORE))
            if [ "$DELTA" -lt 0 ]; then DELTA=$((-DELTA)); fi
            echo "$NAME: ${BEFORE} → ${AFTER} (Δ${DELTA}, guard ${MAX_DELTA})"
            if [ "$DELTA" -gt "$MAX_DELTA" ]; then
              GUARD_FAIL="$GUARD_FAIL ${NAME}(${BEFORE}→${AFTER},Δ${DELTA})"
            fi
          done
          if [ -n "$GUARD_FAIL" ]; then
            {
              echo "## ⚠️ 데이터 급변 감지 — 자동 머지 보류"
              echo ""
              echo "PR: $PR_URL"
              echo "초과 항목:${GUARD_FAIL} (허용 Δ${MAX_DELTA})"
              echo "크롤 오류 가능성 — 수동 검토 후 머지하세요."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          #
          # race 방지: `Vercel` context가 등록되고 SUCCESS인지 *명시 확인*한다.
          # `Vercel Preview Comments`만 올라온 상태는 본 빌드 완료로 간주하지 않는다.
          MAX_WAIT_MIN=15
          SLEEP_SECONDS=20
          ELAPSED=0

          while [ $ELAPSED -lt $((MAX_WAIT_MIN * 60)) ]; do
            ROLLUP=$(gh pr view "$PR_URL" --json statusCheckRollup --jq '.statusCheckRollup')
            HAS_VERCEL=$(echo "$ROLLUP" | jq '[.[] | select((.context // .name) == "Vercel")] | length > 0')
            VERCEL_STATE=$(echo "$ROLLUP" | jq -r '[.[] | select((.context // .name) == "Vercel") | (.state // .conclusion // "PENDING")] | .[0] // "MISSING"')
            HAS_FAIL=$(echo "$ROLLUP" | jq '[.[] | (.state // .conclusion // .status) | . == "FAILURE" or . == "ERROR" or . == "TIMED_OUT" or . == "CANCELLED"] | any')
            ALL_STATES=$(echo "$ROLLUP" | jq -c '[.[] | {ctx: (.context // .name), state: (.state // .conclusion // .status)}]')
            echo "checks: $ALL_STATES (vercel=$VERCEL_STATE, elapsed=${ELAPSED}s)"

            if [ "$HAS_FAIL" = "true" ]; then
              echo "❌ CI failure 감지 — PR을 open으로 남겼으니 수동 검토 부탁합니다: $PR_URL"
              {
                echo "## ❌ 자동 업데이트 CI FAIL"
                echo ""
                echo "PR: $PR_URL"
                echo "Vercel: $VERCEL_STATE"
                echo "States: \`$ALL_STATES\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            if [ "$HAS_VERCEL" = "true" ] && [ "$VERCEL_STATE" = "SUCCESS" ]; then
              echo "✅ Vercel build SUCCESS — 자동 머지 진행: $PR_URL"
              # errexit 대비: merge 명령 실패를 잡아야 아래 MERGED state 재검증이 실행된다
              if ! gh pr merge "$PR_URL" --squash --delete-branch; then
                echo "⚠️ gh pr merge 명령 비정상 종료 — state 재확인"
              fi
              MERGE_STATE=$(gh pr view "$PR_URL" --json state --jq .state)
              if [ "$MERGE_STATE" = "MERGED" ]; then
                {
                  echo "## ✅ 자동 업데이트 머지 완료"
                  echo ""
                  echo "PR: $PR_URL"
                  echo "검증 PASS(roster/identity/photo) · allowlist OK · 급변 가드 OK · Vercel SUCCESS"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              else
                {
                  echo "## ❌ 자동 머지 실패 — 수동 확인 필요"
                  echo ""
                  echo "PR: $PR_URL (state=$MERGE_STATE)"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi

            sleep $SLEEP_SECONDS
            ELAPSED=$((ELAPSED + SLEEP_SECONDS))
          done

          echo "⏱️  Vercel build timeout (${MAX_WAIT_MIN} min) — PR은 open 상태로 남긴다: $PR_URL"
          {
            echo "## ⏱️ 자동 업데이트 timeout"
            echo ""
            echo "PR: $PR_URL"
            echo "Vercel: 15분 이내 종료 안 됨 — 수동 검토 필요"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
