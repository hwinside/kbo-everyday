name: UI Contrast Gate

# 직관 다이어리 카드 등 UI 대비/시각 회귀 게이트.
# Chromium 을 설치해 qa:diary-contrast 를 fail-closed 로 실행한다 —
# browser launch 실패나 대비/overflow assertion 실패가 반드시 check 실패로 이어진다.
# (prebuild 의 graceful skip 과 달리 이 워크플로는 실제 자동 gate 다.)

on:
  pull_request:
    paths:
      - "src/components/my/VenueDiaryCard.tsx"
      - "scripts/qa/venue-diary-card-contrast.mjs"
      - "src/styles/globals.css"
      - ".github/workflows/ui-contrast-gate.yml"
  push:
    branches:
      - main
    paths:
      - "src/components/my/VenueDiaryCard.tsx"
      - "scripts/qa/venue-diary-card-contrast.mjs"
      - "src/styles/globals.css"

jobs:
  ui-contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run diary card contrast gate (fail-closed)
        # DIARY_CONTRAST_REQUIRE_BROWSER=1 → chromium launch 실패도 exit 1(fail-closed)
        env:
          DIARY_CONTRAST_REQUIRE_BROWSER: "1"
        run: npm run qa:diary-contrast
