# CI 티어 QA 게이트 — Vercel prebuild에서 이관된 결정론 게이트(PR-only/path-only) 112개
# gate-tiers.json SSOT 기반. 4샤드 병렬. PR required check로 결속(ruleset은 별도 콘솔 작업).
name: qa-ci-gates

# 보안: PR 코드를 실행하는 워크플로 — 토큰 권한 최소화 + credential 비지속 (삼순 1차 보안 P0)
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: qa-ci-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["0/4", "1/4", "2/4", "3/4"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: gate-tiers selftest (fail-close)
        run: node scripts/qa/run-gate-tiers.mjs --selftest
      - name: run ci-tier gates (shard ${{ matrix.shard }})
        run: node scripts/qa/run-gate-tiers.mjs --tier ci --shard ${{ matrix.shard }}

  # 브랜치 보호 required check용 단일 수렴 잡 — 모든 샤드 성공 시에만 성공
  gates-green:
    needs: gates
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: all shards green?
        run: |
          if [ "${{ needs.gates.result }}" != "success" ]; then
            echo "ci-tier gates failed: ${{ needs.gates.result }}"; exit 1
          fi
          echo ok

  # main ruleset의 필수 context. GitHub가 이 잡의 check-run을 보고하므로
  # 일반 PR에도 별도 status API/쓰기 토큰 없이 실제 CI 결과를 결속한다.
  # 기존 gates-green은 봇 PR·외부 참조와의 호환을 위해 유지한다.
  auto-merge-gate:
    name: auto-merge-gate
    needs: gates-green
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: require successful ci-tier aggregate
        env:
          CI_GATES_RESULT: ${{ needs.gates-green.result }}
        run: |
          if [ "$CI_GATES_RESULT" != "success" ]; then
            echo "auto-merge-gate blocked: gates-green=$CI_GATES_RESULT"
            exit 1
          fi
