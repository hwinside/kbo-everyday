name: Genius Mascot Motion Gate

# 야잘알봇 마스코트 영상 모션 자산의 **강제 브라우저** 게이트 (삼순 #1228 ④).
#
# 왜 별도 워크플로가 필요한가:
#   `qa:genius-mascot-render` 는 Vercel 빌드 컨테이너에 chromium 이 없어서 SKIP 된다.
#   SKIP 은 GREEN 으로 보이므로, 실제 렌더 축(자산이 화면에 그려졌는가 · currentSrc 가
#   맞는가 · 선택 안 된 자산을 네트워크에서 받지 않는가)이 **아무도 안 보는 상태**가 된다.
#   여기서 Chromium 을 설치하고 `MASCOT_RENDER_REQUIRE_BROWSER=1` 로 돌려
#   SKIP 자체를 금지한다(브라우저 launch 실패도 exit 1).
#
# 함께 도는 축:
#   · visual   — 파생 자산 픽셀 재측정(키잉 구멍·과채움·조각삭제·여백·halo·움직임)
#   · selftest — 임계값을 반전시켜 게이트가 실제로 RED 를 내는지 증명(검출력 검사)
#   · motion   — 매핑 SSOT·단일 배선·폐쇄집합
#   · mutations— 변이 주입 시 전부 RED
#   · assets   — **실제 결함주입**(구멍 뚫기·소품 조각 삭제·음공간 메움·manifest 위조)
#
# ⚠️ 자산 mutation 중 `build --check` 를 호출하는 축(M6·M7·L1·L2)은 repo 밖 v1 확정본 WebP가
#    있어야 돌아간다. 여기(CI)에도 원본이 없으므로 `--with-source` 없이 돌린다 —
#    그래야 의도한 assertion 대신 source-missing 으로 먼저 죽는 false-RED 가 안 난다.
#    원본 보유 환경에서는 `npm run qa:genius-mascot-assets:mutations:full` 로 전체를 돌린다.

on:
  pull_request:
    paths: &gate_paths
      - "public/mascot/motion/**"
      - "scripts/assets/build-mascot-motion.py"
      - "scripts/assets/mascot-motion-SOURCES.sha256"
      - "scripts/qa/genius-mascot-render-gate.mjs"
      - "scripts/qa/genius-mascot-visual-qa.mjs"
      - "scripts/qa/genius-mascot-motion.ts"
      - "scripts/qa/genius-mascot-motion-mutations.mjs"
      - "scripts/qa/genius-mascot-asset-mutations.mjs"
      - "scripts/qa/mascot-source-mutate.py"
      - "scripts/qa/mascot-gate-change-detector.mjs"
      - "package.json"
      - "src/components/dm/GeniusMascotImage.tsx"
      - "src/lib/constants/baseball-genius.ts"
      - ".github/workflows/genius-mascot-motion-gate.yml"
  push:
    branches:
      - main
    paths: *gate_paths

jobs:
  # package.json은 트리거에 남긴다 — 빼면 package-only 변경(mascot 게이트 script를 true로
  # 바꾸거나 삭제)이 workflow 자체를 안 띄워 GREEN이 된다(삼순 #1254 blocker). 대신
  # semantic change-detector로 mascot 관련 표면(mascot 명명 script 전체 · 타 script 값 속
  # mascot 토큰 · playwright 의존성)이 실제로 바뀌었는지 판정해, 무관 package.json 변경은
  # heavy job들을 **성공-skip** 시킨다. 판정 불능은 fail-closed(heavy).
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_heavy: ${{ steps.decide.outputs.run_heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: detector 검출력 증명 (관련/무관 fixture selftest)
        run: node scripts/qa/mascot-gate-change-detector.mjs --selftest

      - name: mascot 관련 변경 판정
        id: decide
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD="${{ github.sha }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "base 확인 불가 → fail-closed heavy"
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # package.json 외 트리거 경로가 바뀌었으면 무조건 heavy
          NON_PKG=$(git diff --name-only "$BASE" "$HEAD" -- \
            'public/mascot/motion' \
            'scripts/assets/build-mascot-motion.py' \
            'scripts/assets/mascot-motion-SOURCES.sha256' \
            'scripts/qa/genius-mascot-render-gate.mjs' \
            'scripts/qa/genius-mascot-visual-qa.mjs' \
            'scripts/qa/genius-mascot-motion.ts' \
            'scripts/qa/genius-mascot-motion-mutations.mjs' \
            'scripts/qa/genius-mascot-asset-mutations.mjs' \
            'scripts/qa/mascot-source-mutate.py' \
            'scripts/qa/mascot-gate-change-detector.mjs' \
            '.github/workflows/genius-mascot-motion-gate.yml')
          if [ -n "$NON_PKG" ]; then
            echo "trigger 경로 변경:"; echo "$NON_PKG"
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git show "$BASE:package.json" > /tmp/base-package.json
          VERDICT=$(node scripts/qa/mascot-gate-change-detector.mjs /tmp/base-package.json package.json | tail -1)
          echo "detector verdict: $VERDICT"
          if [ "$VERDICT" = "skip" ]; then
            echo "run_heavy=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
          fi

  genius-mascot-motion:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 무관 변경 성공-skip
        if: needs.detect.outputs.run_heavy != 'true'
        run: echo "package.json 변경이 mascot 표면과 무관 — heavy 축 skip (성공)"

      - uses: actions/checkout@v4
        if: needs.detect.outputs.run_heavy == 'true'

      - name: Setup Node
        if: needs.detect.outputs.run_heavy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: needs.detect.outputs.run_heavy == 'true'
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        if: needs.detect.outputs.run_heavy == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: needs.detect.outputs.run_heavy == 'true'
        run: npx playwright install --with-deps chromium

      - name: 자산 픽셀 무결성 (키잉 구멍 · 과채움 · 조각삭제 · 여백 · halo · 움직임)
        if: needs.detect.outputs.run_heavy == 'true'
        run: npm run qa:genius-mascot-visual

      - name: 게이트 검출력 증명 (임계값 반전 → RED 여야 한다)
        if: needs.detect.outputs.run_heavy == 'true'
        run: npm run qa:genius-mascot-visual:selftest

      - name: 매핑 SSOT · 단일 배선 · 폐쇄집합
        if: needs.detect.outputs.run_heavy == 'true'
        run: npm run qa:genius-mascot-motion

      - name: 매핑 변이 주입 (전부 RED 여야 한다)
        if: needs.detect.outputs.run_heavy == 'true'
        run: npm run qa:genius-mascot-motion:mutations

      - name: 자산 결함주입 (실제 훼손 → 전부 RED 여야 한다)
        if: needs.detect.outputs.run_heavy == 'true'
        # v1 확정본 WebP가 없는 환경이므로 `--with-source` 없이 = 자산·manifest 축만.
        run: npm run qa:genius-mascot-assets:mutations

      - name: 실렌더 게이트 — 브라우저 강제 (SKIP 금지, fail-closed)
        if: needs.detect.outputs.run_heavy == 'true'
        # MASCOT_RENDER_REQUIRE_BROWSER=1 → chromium 이 없거나 launch 실패해도 exit 1.
        # Vercel prebuild 의 graceful skip 과 달리 여기서는 SKIP 이 곧 실패다.
        env:
          MASCOT_RENDER_REQUIRE_BROWSER: "1"
        run: npm run qa:genius-mascot-render

      - name: 실렌더 게이트 검출력 증명 (기대 반전 → RED 여야 한다)
        if: needs.detect.outputs.run_heavy == 'true'
        env:
          MASCOT_RENDER_REQUIRE_BROWSER: "1"
        run: npm run qa:genius-mascot-render:selftest

      - name: 실패 시 캡처 아티팩트 업로드
        if: failure() && needs.detect.outputs.run_heavy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mascot-render-captures
          path: .qa-artifacts/mascot/
          if-no-files-found: ignore
          retention-days: 7

  # 🔴 v1 확정본 WebP가 있어야만 도는 축을 **CI 에서도** 돌린다 (삼순 2026-08-17).
  #    앞 job 은 원본이 없어 M6·M7·L1·L2 를 건너뛴다. 그것만으로 끝내면 source-ledger·
  #    재현 fail-close 가 다시 **로컬 전용**이 된다 — "내 노트북에서는 돌았다"는 아무도
  #    강제할 수 없는 증거다.
  #
  #    provision 은 **대장(sha256)으로 검증**된다. 다운로드한 무언가가 아니라 *그 원본*
  #    이어야 증명이 된다. 못 받거나 해시가 다르면 조용히 skip 하지 않고 즉시 실패한다
  #    (skip 이 곧 false-green 이므로).
  genius-mascot-motion-source:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # v1 확정본 13종은 repo 밖에 산다 → Release 자산으로 공급한다.
      # 확정본을 교체하면 새 tag를 올리고 `--rewrite-ledger`로 대장을 갱신한다(둘은 함께 움직인다).
      MASCOT_SRC_TAG: mascot-motion-src-v1-confirmed
    steps:
      - uses: actions/checkout@v4
        if: needs.detect.outputs.run_heavy == 'true'

      - name: Setup Node
        if: needs.detect.outputs.run_heavy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        if: needs.detect.outputs.run_heavy == 'true'
        run: npm ci --no-audit --no-fund

      - name: Install Python deps (빌더가 쓰는 것)
        if: needs.detect.outputs.run_heavy == 'true'
        run: python3 -m pip install --quiet --break-system-packages numpy scipy pillow

      - name: v1 확정본 WebP provision — 대장 해시로 exact 검증
        if: needs.detect.outputs.run_heavy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mascot-src/v1
          gh release download "$MASCOT_SRC_TAG" \
            --repo "${{ github.repository }}" \
            --pattern '*-black.webp' --dir /tmp/mascot-src/v1
          # "받았다"가 아니라 **"하린아빠가 컨펌한 그 v1 확정본이다"** 를 증명한다.
          cd /tmp/mascot-src/v1 && shasum -a 256 -c \
            "$GITHUB_WORKSPACE/scripts/assets/mascot-motion-SOURCES.sha256"

      - name: 재현 검사 — 파생 자산·manifest 가 이 원본에서 나오는가
        if: needs.detect.outputs.run_heavy == 'true'
        env:
          MASCOT_SSOT: /tmp/mascot-src/v1
        run: python3 scripts/assets/build-mascot-motion.py --check

      - name: 자산 결함주입 **전체** (source-level + ledger 축 포함)
        if: needs.detect.outputs.run_heavy == 'true'
        env:
          MASCOT_SSOT: /tmp/mascot-src/v1
        run: npm run qa:genius-mascot-assets:mutations:full
