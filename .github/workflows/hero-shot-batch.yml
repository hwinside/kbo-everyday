name: Hero Shot Auto Batch

# roster 선수 중 히어로샷이 없고 공식 헤드샷(public/players/)이 있는 선수를 자동 탐지
# → 로컬 rembg 파이프라인(scripts/hero/build-hero.py)으로 컷아웃 생성 → allowlist 갱신
# → PR 생성 후 자동 머지.
#
# 2026-06-14 재작성: 이전 Gemini 이미지 생성 + remove.bg + naver 후보 교차검증 파이프라인을
# 전면 폐기. KBO 공식 헤드샷을 소스로 한 결정적(deterministic) 로컬 컷아웃으로 전환해
# 불쾌한 골짜기 제거 + 외부 API/시크릿 의존 0.
# 2026-06-17: 소스가 KBO 공식샷 그대로(AI 생성 없음)라 매핑 외 리스크가 없어 자동 머지로 전환
# (하린아빠 결정, #cs 1781402263.616939). 신규 선수 채우기 전용(--missing-only)이라 기존 히어로는 불변.

# 2026-07-18: 주 1회 → 매일로 변경 (로스터 변동 공개 게이트 — 신규 등록 선수가 히어로컷 없이는
# published 승격이 안 되므로, 주 1회 배치면 최대 7일 pending. --missing-only라 신규 없으면 no-op.)
on:
  schedule:
    - cron: "0 18 * * *" # 매일 18:00 UTC = 익일 03:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write # auto-merge-gate commit status 스탬프 (exact SHA 결속)

concurrency:
  group: hero-shot-batch
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pipeline deps
        run: pip install --quiet rembg onnxruntime pillow numpy scipy

      - name: Generate missing heroes (rembg, local — no external API)
        id: gen
        run: |
          python scripts/hero/build-hero.py --missing-only --update-approved | tee /tmp/hero-gen.log
          if [ -n "$(git status --porcelain public/players-hero src/lib/constants/hero-approved-kboids.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "신규 히어로 없음 — 변경 사항 없이 종료."
          fi

      # 머지 게이트 (삼순 NO-GO 반영, 2026-06-17): --admin 자동 머지가 Vercel/validator 체크를
      # 우회하므로, 머지 직전 워크플로 안에서 명시 검증을 PASS해야만 다음 머지 스텝으로 넘어간다.
      # 어느 하나라도 실패하면 set -e 로 잡이 즉시 stop → 머지 스텝 미실행.
      - name: Verify (merge gate)
        if: steps.gen.outputs.changed == 'true'
        run: |
          set -e
          npm ci
          npm run qa:foreign-photo
          python scripts/hero/build-hero.py --verify

      - name: Create + auto-merge PR (verified changes only)
        if: steps.gen.outputs.changed == 'true'
        run: |
          set -e
          BRANCH="auto/hero-shot-batch-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add public/players-hero src/lib/constants/hero-approved-kboids.json
          git commit -m "chore(hero): 자동 배치 — 신규 히어로샷 생성 (rembg 컷아웃)"
          git push origin "$BRANCH"
          HEAD_SHA="$(git rev-parse HEAD)"
          PR_URL=$(gh pr create --base main --head "$BRANCH" \
            --title "chore(hero): 자동 히어로샷 배치 (rembg)" \
            --body "공식 헤드샷(public/players/) → rembg 로컬 컷아웃(scripts/hero/build-hero.py)으로 신규 히어로샷 생성. 외부 API/시크릿 없음. 결정적 파이프라인. 머지 전 qa:foreign-photo + hero webp 규격/approved 정합성 검증 PASS. 저위험 자동 머지(2026-06-17 하린아빠 정책).")
          # 검증(Verify 스텝)을 통과한 경우에만 도달. 생성한 head 커밋만 머지(--match-head-commit).
          # 2026-08-18: main ruleset required check(auto-merge-gate) 도입에 맞춰 --admin 직접 머지를
          # native auto-merge로 전환 — Verify PASS를 exact SHA에 스탬프하고, Vercel 완료 시 GitHub이 머지.
          # (브랜치 삭제는 repo 설정 delete_branch_on_merge가 담당)
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context=auto-merge-gate \
            -f description="hero-shot verify PASS (run ${GITHUB_RUN_ID})" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh pr merge "$PR_URL" --auto --squash --match-head-commit "$HEAD_SHA"
