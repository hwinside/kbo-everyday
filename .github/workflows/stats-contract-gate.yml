name: Stats Contract Gate

# 스탯 파이프라인 **계약** 게이트 — 결정론적. live KBO 를 타지 않는다.
#
# ── 왜 나눴나(2026-08-05) ──────────────────────────────────────
# 종전 `stats-source-truth-gate.yml` 은 배선·완주계약·mutation RED 증명과
# live KBO strict equality 를 한 job 에 몰아넣고 모든 PR 에서 돌렸다. 실측 결과:
#
#   ① 무관한 PR 이 전부 RED — 경기가 진행되면 KBO 원본이 커밋 스냅샷보다 앞선다.
#      8/4 12:46Z 이후 `main` push 와 스탯을 건드리지도 않은 PR 들이 줄줄이 실패했다.
#      게이트가 코드 결함이 아니라 "시간이 흘렀다"를 보고하고 있었다.
#
#   ② mutation RED 증명이 무력화 — 증명 스텝이 전부
#      `오염 주입 → 게이트가 통과하면 exit 1` 구조다. 그런데 KBO drift 로 baseline 이
#      이미 RED 면, 오염을 넣든 안 넣든 게이트는 항상 실패한다. 즉 **검증력을 하나도
#      입증하지 못한 채 job 은 success** 다. 우리가 계속 잡아온 false-green 과 같은 축이다.
#
# 그래서 성격이 다른 두 가지를 분리한다.
#   - 이 파일: 배선·행동 계약 + 검증력 증명. 결정론적이라 **항상** 돌 수 있다.
#   - stats-freshness-gate.yml: live 원본 대조. 스냅샷이 바뀔 때만 돈다.
#
# ⚠️ live strict equality 를 **완화한 게 아니다**. freshness 게이트가 전 행·전 필드
# 대조를 그대로 수행한다(삼순 NO-GO: "KBO가 앞서면 통과" 식 완화는 오염을 숨긴다).
# 바뀐 것은 *언제 돌리는가* 와 *원본이 흔들릴 때 어떻게 분류하는가* 뿐이다.
#
# ⚠️ paths allowlist 를 두지 않는다(2026-08-04 하린아빠 결정 유지).
# allowlist 를 두면 거기 안 걸리는 새 의존이 생겼을 때 workflow 가 통째 SKIP 되고
# required check 는 "통과"로 보인다 = trigger 자체가 false-green 이다.
# 이 job 은 네트워크가 없어 빠르므로 커버리지를 택한다.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  stats-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ── 배선·행동 계약 (네트워크 없음) ─────────────────────────
      - name: Snapshot guard contract (fail-closed)
        # 네 데이터셋 스냅샷 가드가 promote 앞에 배선돼 있는지 +
        # assertSourceTruth 가 스텁 주입에서 실제로 reject 하는지.
        #
        # ⚠️ 이 스텝이 종전 live RED 증명 4종을 **결정론적으로** 대체한다.
        # stub browser 로 KBO 응답을 고정한 채 ERA 오염 / 도루(sb) 오염 /
        # 파생(defense-runs) 오염 / 행 누락 / 수집 0행을 각각 주입하고
        # `assert.rejects` 로 확인한다. baseline 이 항상 PASS 이므로
        # "오염을 넣었을 때만 RED" 가 실제로 증명된다 — drift 와 무관하다.
        run: npm run qa:stats-snapshot-guard

      - name: Atomic promote contract (fail-closed)
        # staging 실패 시 대상 파일 전원 byte-identical, promote 중간 실패 시 롤백.
        run: npm run qa:atomic-promote

      - name: Pagination completion contract (fail-closed)
        # 11페이지 fake 페이저로 지연 흡수·재클릭 회복·전환 실패·stale·중간 누락을 행동 검증.
        run: npm run qa:kbo-pagination

      - name: Select/sort change gate
        run: npm run qa:kbo-select

      - name: Gate trigger coverage
        # 두 게이트의 trigger 등록 + freshness paths 가 검증기 입력을 전부 덮는지 결속.
        run: npm run qa:stats-gate-trigger

      - name: Freshness wrapper behavior contract (deterministic)
        # ⚠️ 이 스텝이 삼순 P0(2026-08-05)을 닫는다.
        #
        # freshness 게이트는 데이터 PR 에서만 돈다. 그래서 코드 PR 에서 래퍼를
        # `process.exit(0)` 으로 바꾸거나 package alias 를 no-op 으로 만들어도,
        # 종전 contract 게이트는 alias 존재·문자열만 봐서 GREEN 이었다. 그 PR 이
        # 머지되면 이후 데이터 PR 은 이미 무력화된 래퍼를 통과시킨다
        # = live strict equality 가 0회 수행된다.
        #
        # 여기서는 네트워크 없이 스텁 검증기로 래퍼의 **판정 행동**을 직접 검증한다
        # (안정 PASS/안정 FAIL/flap/unreachable/window 미달/floor clamp/prod-mode bypass).
        #
        # ⚠️ npm alias 가 아니라 **파일 경로로 직접** 부른다(삼순 2차 NO-GO).
        # alias 로 부르면 mutation 을 인지하는 decoy alias 하나로 실제 스모크를 0회
        # 실행하고도 전체 GREEN 을 만들 수 있다 — trigger 는 alias 존재만 보기 때문이다.
        run: node scripts/qa/stats-freshness-contract-smoke.mjs

      # ── 검증력 증명 (결함주입) ────────────────────────────────
      # 아래 스텝들은 "게이트가 통과하면 job 이 죽는" 구조다.
      # 따라서 이 job 의 success 자체가 게이트에 검증력이 있다는 증거다.
      #
      # ⚠️ 종전과 달리 여기서 부르는 게이트는 전부 결정론적이다. baseline 이
      # 외부 상태로 RED 가 되지 않으므로, 증명이 조용히 공회전하지 않는다.
      - name: RED proof — snapshot guard must fail on injected corruption
        run: |
          node -e "
            const fs = require('fs');
            const p = 'scripts/lib/stats-source-truth.mjs';
            let src = fs.readFileSync(p, 'utf8');
            const needle = 'if (failures.length) {';
            if (!src.includes(needle)) {
              console.error('판정 분기를 찾지 못했다 — 게이트 대상 코드가 바뀌었다');
              process.exit(1);
            }
            // 불일치가 있어도 던지지 않도록 판정만 죽인다.
            fs.writeFileSync(p, src.replace(needle, 'if (false && failures.length) {'));
          "
          if npm run qa:stats-snapshot-guard; then
            echo "::error::원본 대조 판정을 죽였는데 게이트가 통과했다 — 값 대조가 무력하다"
            git checkout -- scripts/lib/stats-source-truth.mjs
            exit 1
          fi
          git checkout -- scripts/lib/stats-source-truth.mjs
          git diff --exit-code

      - name: RED proof — derived verification must stay mandatory
        run: |
          node -e "
            const fs = require('fs');
            const p = 'scripts/lib/stats-source-truth.mjs';
            let src = fs.readFileSync(p, 'utf8');
            const needle = 'if (missing.length) {';
            if (!src.includes(needle)) {
              console.error('파생 입력 필수 계약을 찾지 못했다 — 게이트 대상 코드가 바뀌었다');
              process.exit(1);
            }
            // 파생 입력이 비어도 통과하도록 fail-close 를 죽인다.
            fs.writeFileSync(p, src.replace(needle, 'if (false && missing.length) {'));
          "
          if npm run qa:stats-snapshot-guard; then
            echo "::error::파생 검증 skip 이 게이트를 통과했다 — 검증을 끌 수 있다"
            git checkout -- scripts/lib/stats-source-truth.mjs
            exit 1
          fi
          git checkout -- scripts/lib/stats-source-truth.mjs
          git diff --exit-code

      - name: RED proof — pagination completion contract must fail closed
        run: |
          node -e "
            const fs = require('fs');
            const p = 'scripts/lib/kbo-pagination.mjs';
            let src = fs.readFileSync(p, 'utf8');
            if (!src.includes('source_pagination_incomplete')) {
              console.error('완주 계약 예외가 없다 — 게이트 대상 코드가 바뀌었다');
              process.exit(1);
            }
            const needle = '    if (groupClickAccepted) {';
            if (!src.includes(needle)) {
              console.error('그룹 전환 실패 분기를 찾지 못했다 — 게이트 대상 코드가 바뀌었다');
              process.exit(1);
            }
            fs.writeFileSync(p, src.replace(needle, '    if (false && groupClickAccepted) {'));
          "
          if npm run qa:kbo-pagination; then
            echo "::error::그룹 전환 유실을 EOF 로 오인해도 게이트가 통과했다"
            git checkout -- scripts/lib/kbo-pagination.mjs
            exit 1
          fi
          git checkout -- scripts/lib/kbo-pagination.mjs
          git diff --exit-code

      - name: RED proof — trigger coverage must fail when freshness paths go stale
        # freshness 게이트가 검증기 입력을 덮지 못하면 데이터 PR 이 게이트를 SKIP 한다.
        # 그 결손을 trigger 스모크가 실제로 잡는지 증명한다.
        run: |
          node -e "
            const fs = require('fs');
            const p = '.github/workflows/stats-freshness-gate.yml';
            const src = fs.readFileSync(p, 'utf8');
            const needle = '      - \"src/lib/constants/stats-*-defense.json\"';
            if (!src.includes(needle)) {
              console.error('freshness paths 에서 defense 항목을 찾지 못했다');
              process.exit(1);
            }
            fs.writeFileSync(p, src.replace(needle, ''));
          "
          if npm run qa:stats-gate-trigger; then
            echo "::error::freshness paths 에 구멍이 생겼는데 trigger 게이트가 통과했다"
            git checkout -- .github/workflows/stats-freshness-gate.yml
            exit 1
          fi
          git checkout -- .github/workflows/stats-freshness-gate.yml
          git diff --exit-code

      - name: RED proof — updater must verify freshness before PR creation
        run: |
          node -e "
            const fs = require('fs');
            const p = '.github/workflows/update-roster-stats.yml';
            let src = fs.readFileSync(p, 'utf8');
            const needle = 'run: node scripts/qa/stats-freshness-verify.mjs';
            if (!src.includes(needle)) process.exit(1);
            fs.writeFileSync(p, src.replace(needle, 'run: echo decoy'));
          "
          if npm run qa:stats-gate-trigger; then
            echo "::error::updater의 PR 전 freshness를 decoy로 바꿨는데 게이트가 통과했다"
            git checkout -- .github/workflows/update-roster-stats.yml
            exit 1
          fi
          git checkout -- .github/workflows/update-roster-stats.yml
          git diff --exit-code

      - name: RED proof — source digest binding must be required
        run: |
          node -e "
            const fs = require('fs');
            const p = 'scripts/lib/stats-source-truth.mjs';
            let src = fs.readFileSync(p, 'utf8');
            const needle = 'export const SOURCE_DIGEST_MARKER = \"KBO_SOURCE_DIGEST\";';
            if (!src.includes(needle)) process.exit(1);
            fs.writeFileSync(p, src.replace(needle, 'export const SOURCE_DIGEST_MARKER = \"DECOY_DIGEST\";'));
          "
          if node scripts/qa/stats-freshness-contract-smoke.mjs; then
            echo "::error::원본 digest marker를 끊었는데 contract가 통과했다"
            git checkout -- scripts/lib/stats-source-truth.mjs
            exit 1
          fi
          git checkout -- scripts/lib/stats-source-truth.mjs
          git diff --exit-code

      - name: RED proof — freshness paths must reject code-path overreach
        # 산출물 외 코드 경로가 들어오면 데이터 무변경 PR도 live drift로 무조건 RED다.
        run: |
          node -e "
            const fs = require('fs');
            const p = '.github/workflows/stats-freshness-gate.yml';
            let src = fs.readFileSync(p, 'utf8');
            const needle = '      - \"src/lib/constants/foreign-id-map.ts\"';
            if (!src.includes(needle)) process.exit(1);
            fs.writeFileSync(p, src.replace(needle, needle + '\n      - \"scripts/lib/stats-source-truth.mjs\"'));
          "
          if npm run qa:stats-gate-trigger; then
            echo "::error::freshness paths 에 코드 경로가 들어왔는데 게이트가 통과했다"
            git checkout -- .github/workflows/stats-freshness-gate.yml
            exit 1
          fi
          git checkout -- .github/workflows/stats-freshness-gate.yml
          git diff --exit-code

      - name: RED proof — no-op freshness alias must fail
        # package alias 를 `echo ok` 로 바꾸는 무력화가 실제로 잡히는지.
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (!/^node /.test(pkg.scripts['qa:stats-freshness'] ?? '')) {
              console.error('freshness alias 형태가 바뀌었다 — 게이트 대상이 바뀌었다');
              process.exit(1);
            }
            pkg.scripts['qa:stats-freshness'] = 'echo ok';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          if node scripts/qa/stats-freshness-contract-smoke.mjs; then
            echo "::error::freshness alias 를 no-op 으로 바꿨는데 게이트가 통과했다 — live 대조를 지울 수 있다"
            git checkout -- package.json
            exit 1
          fi
          git checkout -- package.json
          git diff --exit-code

      - name: RED proof — gutted freshness wrapper must fail
        # 래퍼 본문을 `process.exit(0)` 한 줄로 바꾸는 무력화가 잡히는지.
        run: |
          node -e "
            const fs = require('fs');
            fs.writeFileSync(
              'scripts/qa/stats-freshness-verify.mjs',
              'process.exit(0);\n',
            );
          "
          if node scripts/qa/stats-freshness-contract-smoke.mjs; then
            echo "::error::freshness 래퍼를 exit(0) 로 비웠는데 게이트가 통과했다"
            git checkout -- scripts/qa/stats-freshness-verify.mjs
            exit 1
          fi
          git checkout -- scripts/qa/stats-freshness-verify.mjs
          git diff --exit-code

      - name: RED proof — freshness must not accept unstable readings
        # 흔들리는 판독을 통과로 흘리는 변경(=temporal green 재생산)이 잡히는지.
        run: |
          node -e "
            const fs = require('fs');
            const p = 'scripts/qa/stats-freshness-verify.mjs';
            const src = fs.readFileSync(p, 'utf8');
            const needle = 'console.error(\n  \`\\n❌ stats_source_unstable';
            const idx = src.indexOf('stats_source_unstable:');
            if (idx === -1) {
              console.error('불안정 분류 지점을 찾지 못했다 — 게이트 대상 코드가 바뀌었다');
              process.exit(1);
            }
            // 마지막 fail-close(process.exit(1))를 통과로 뒤집는다.
            const tail = src.slice(idx);
            if (!tail.includes('process.exit(1);')) {
              console.error('불안정 경로의 fail-close 를 찾지 못했다');
              process.exit(1);
            }
            fs.writeFileSync(
              p,
              src.slice(0, idx) + tail.replace(/process\.exit\(1\);\s*$/, 'process.exit(0);\n'),
            );
          "
          if node scripts/qa/stats-freshness-contract-smoke.mjs; then
            echo "::error::불안정 판독을 통과로 바꿨는데 게이트가 통과했다 — temporal green 재생산"
            git checkout -- scripts/qa/stats-freshness-verify.mjs
            exit 1
          fi
          git checkout -- scripts/qa/stats-freshness-verify.mjs
          git diff --exit-code

      - name: RED proof — stability window floor must hold
        # 안정 window 하한을 낮추는 변경(20s 2회로 회귀)이 잡히는지.
        run: |
          node -e "
            const fs = require('fs');
            const p = 'scripts/qa/stats-freshness-verify.mjs';
            const src = fs.readFileSync(p, 'utf8');
            const needle = 'const MIN_STABILITY_WINDOW_MS = 180_000;';
            if (!src.includes(needle)) {
              console.error('안정 window 하한 상수를 찾지 못했다');
              process.exit(1);
            }
            fs.writeFileSync(p, src.replace(needle, 'const MIN_STABILITY_WINDOW_MS = 1;'));
          "
          if node scripts/qa/stats-freshness-contract-smoke.mjs; then
            echo "::error::안정 window 하한을 1ms 로 낮췄는데 게이트가 통과했다 — flip 주기 안 2회 판독으로 회귀 가능"
            git checkout -- scripts/qa/stats-freshness-verify.mjs
            exit 1
          fi
          git checkout -- scripts/qa/stats-freshness-verify.mjs
          git diff --exit-code

      - name: RED proof — prod-mode mid-loop bypass must fail
        # 삼순 3차 NO-GO: 2차 marker 검사는 spawn 1회만 봤다. 첫 verdict 직후
        # seam 이 꺼졌을 때 exit(0) 하면 marker 존재 + config 정상인데 안정성 반복/window 는 0이다.
        # prod-mode 종단 검사가 이 우회로를 실제로 잡는지 증명한다.
        run: |
          node -e "
            const fs = require('fs');
            const p = 'scripts/qa/stats-freshness-verify.mjs';
            const src = fs.readFileSync(p, 'utf8');
            const needle = '  const verdict = await runVerifierOnce(attempt);';
            if (!src.includes(needle)) {
              console.error('첫 verdict 주입 지점을 찾지 못했다 — 게이트 대상 코드가 바뀌었다');
              process.exit(1);
            }
            fs.writeFileSync(
              p,
              src.replace(needle, needle + '\n  if (!CONTRACT_TEST) process.exit(0);'),
            );
          "
          if node scripts/qa/stats-freshness-contract-smoke.mjs; then
            echo "::error::prod 모드에서 첫 판독 후 조기 통과시켰는데 게이트가 통과했다 — 반복/window 0"
            git checkout -- scripts/qa/stats-freshness-verify.mjs
            exit 1
          fi
          git checkout -- scripts/qa/stats-freshness-verify.mjs
          git diff --exit-code

      - name: RED proof — decoy alias must not replace the real smoke
        # 이 job 이 스모크를 **경로로** 부르는지. alias 로 부르면 decoy alias 하나로
        # 실제 스모크를 0회 실행하고도 전체 GREEN 을 만들 수 있다.
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.scripts['qa:stats-freshness-contract'] = 'echo decoy';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          if node scripts/qa/stats-freshness-contract-smoke.mjs; then
            echo "::error::contract alias 를 decoy 로 바꿨는데 게이트가 통과했다"
            git checkout -- package.json
            exit 1
          fi
          git checkout -- package.json
          git diff --exit-code

      - name: RED proof — baseline shell suffix must fail structural binding
        # `run: node smoke.mjs || true` 는 실제 스모크가 RED 여도 step 을 GREEN 으로 만든다.
        # 문자열 포함 확인으로는 통과하므로 YAML 구조 exact run 검사가 잡아야 한다.
        run: |
          node -e "
            const fs = require('fs');
            const p = '.github/workflows/stats-contract-gate.yml';
            const src = fs.readFileSync(p, 'utf8');
            const needle = 'run: node scripts/qa/stats-freshness-contract-smoke.mjs';
            if (!src.includes(needle)) {
              console.error('baseline exact run 을 찾지 못했다');
              process.exit(1);
            }
